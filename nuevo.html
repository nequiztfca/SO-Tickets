<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo ticket · Sistema Tickets TFCA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app-header"></div>

  <main class="container py-4" style="max-width:860px">
    <div id="needLogin" class="text-center py-5 d-none">
      <i class="bi bi-lock display-4 text-body-secondary"></i>
      <h4 class="mt-3">Necesitas iniciar sesión</h4>
      <p class="text-body-secondary">Solo el equipo puede levantar tickets.</p>
      <button class="btn btn-primary" onclick="TFCA.Header.openLogin()"><i class="bi bi-box-arrow-in-right"></i> Login</button>
    </div>

    <form id="frm" class="card border-0 rounded-4 shadow-sm d-none" novalidate>
      <div class="card-body p-4">
        <h4 class="mb-1"><i class="bi bi-plus-circle text-primary"></i> Levantar requerimiento</h4>
        <p class="text-body-secondary small mb-4">Describe el problema o necesidad. Puedes asignarlo ahora o dejarlo <b>sin asignar</b> para que alguien lo tome.</p>

        <div class="mb-3">
          <label class="form-label fw-semibold">Título *</label>
          <input class="form-control" name="titulo" maxlength="140" required placeholder="Ej. Error al generar reporte de ventas">
          <div class="invalid-feedback">Escribe un título.</div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Descripción</label>
          <textarea class="form-control" name="descripcion" rows="5" placeholder="¿Qué pasa? ¿Cómo reproducirlo? ¿Qué se espera?"></textarea>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-sm-4"><label class="form-label fw-semibold">Categoría</label><select class="form-select" name="categoria" id="selCat"></select></div>
          <div class="col-sm-4"><label class="form-label fw-semibold">Prioridad</label><select class="form-select" name="prioridad" id="selPrio"></select></div>
          <div class="col-sm-4"><label class="form-label fw-semibold">Fecha límite <span class="fw-normal text-body-secondary small">(hora opcional)</span></label>
            <div class="d-flex gap-1"><input class="form-control" type="date" name="fechaLimite"><input class="form-control" type="time" name="horaLimite" style="max-width:120px"></div></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Módulos <span class="fw-normal text-body-secondary small">(etiquetas; puedes crear nuevos)</span></label>
          <div id="pickMods"><span class="small text-body-secondary">Cargando módulos…</span></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Asignar a <span class="fw-normal text-body-secondary small">(una o varias personas, opcional)</span></label>
          <div class="user-pick" id="pickUsers"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Checklist inicial <span class="fw-normal text-body-secondary small">(una tarea por línea, opcional)</span></label>
          <textarea class="form-control" name="checklist" rows="3" placeholder="Revisar logs&#10;Corregir consulta&#10;Validar con usuario"></textarea>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Adjuntos <span class="fw-normal text-body-secondary small">(imágenes o documentos · también puedes pegar con Ctrl+V)</span></label>
          <input class="form-control" type="file" id="files" multiple>
          <div class="pending-files px-0 pt-2" id="pending"></div>
        </div>
        <div class="d-flex justify-content-end gap-2">
          <a href="index.html" class="btn btn-light border">Cancelar</a>
          <button class="btn btn-primary" id="btnSave" type="submit"><i class="bi bi-send"></i> Crear ticket</button>
        </div>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script>
  /* =================== Nuevo ticket (MVC) =================== */
  const { ENV, Auth, Api, UI } = TFCA;
  const esc = UI.esc;

  const Model = {
    files: [], picker: null,
    async save(data) {
      const t = await Api.create(data);
      for (const f of this.files) {
        const payload = await UI.fileToPayload(f);
        await Api.addEntry({ ticketId: t.id, tipo: /^image\//.test(payload.mime) ? 'imagen' : 'archivo', file: payload });
      }
      return t;
    }
  };

  const View = {
    init() {
      selCat.innerHTML = ENV.CATEGORIAS.map(c => `<option>${esc(c)}</option>`).join('');
      selPrio.innerHTML = ENV.PRIORIDADES.map(p => `<option ${p === 'Media' ? 'selected' : ''}>${esc(p)}</option>`).join('');
      pickUsers.innerHTML = ENV.USERS.map(u => `<input type="checkbox" id="u_${esc(u.user)}" value="${esc(u.user)}"><label for="u_${esc(u.user)}">${UI.avatar(u.user, 24)} ${esc(u.name)}</label>`).join('');
    },
    pending() {
      pending.innerHTML = Model.files.map((f, i) => `<span class="pf">${/^image\//.test(f.type) ? `<img src="${URL.createObjectURL(f)}">` : '<i class="bi bi-file-earmark"></i>'}${esc(f.name)}<button type="button" class="btn-close btn-sm" data-rm="${i}" style="font-size:.6rem"></button></span>`).join('');
    }
  };

  const Controller = {
    addFiles(list) {
      for (const f of list) {
        if (f.size > ENV.MAX_FILE_MB * 1048576) { UI.toast(`${f.name} supera ${ENV.MAX_FILE_MB} MB`, 'warning'); continue; }
        Model.files.push(f);
      }
      View.pending();
    },
    async submit(ev) {
      ev.preventDefault();
      if (!frm.checkValidity()) { frm.classList.add('was-validated'); return; }
      const f = new FormData(frm);
      const data = {
        titulo: f.get('titulo').trim(),
        descripcion: f.get('descripcion').trim(),
        categoria: f.get('categoria'),
        prioridad: f.get('prioridad'),
        fechaLimite: UI.dueJoin(f.get('fechaLimite'), f.get('horaLimite')),
        asignados: [...pickUsers.querySelectorAll('input:checked')].map(i => i.value),
        checklist: f.get('checklist').split('\n').map(s => s.trim()).filter(Boolean),
        modulos: Model.picker ? Model.picker.get() : [UI.MOD_DEFAULT]
      };
      btnSave.disabled = true; btnSave.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando…';
      try {
        const t = await Model.save(data);
        UI.toast(`Ticket ${t.id} creado`);
        setTimeout(() => location.href = 'ticket.html?id=' + encodeURIComponent(t.id), 600);
      } catch (e) {
        UI.toast(e.message, 'danger');
        btnSave.disabled = false; btnSave.innerHTML = '<i class="bi bi-send"></i> Crear ticket';
      }
    },
    init() {
      TFCA.Header.render('nuevo');
      if (!Auth.isLogged()) { needLogin.classList.remove('d-none'); return; }
      frm.classList.remove('d-none');
      View.init();
      Api.modules().then(m => UI.setModules(m)).catch(() => UI.setModules([]))
        .finally(() => { Model.picker = UI.modulePicker(pickMods, { selected: [UI.MOD_DEFAULT] }); });
      frm.addEventListener('submit', e => this.submit(e));
      files.addEventListener('change', () => { this.addFiles(files.files); files.value = ''; });
      pending.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { Model.files.splice(+b.dataset.rm, 1); View.pending(); } });
      document.addEventListener('paste', e => {
        const imgs = [...(e.clipboardData?.files || [])];
        if (imgs.length) { e.preventDefault(); this.addFiles(imgs); }
      });
    }
  };
  Controller.init();
  </script>
</body>
</html>
