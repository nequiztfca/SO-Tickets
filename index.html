<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablero · Sistema Tickets TFCA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app-header"></div>

  <main class="container-fluid py-3">
    <!-- KPIs -->
    <div class="row g-2 mb-3" id="kpis"></div>

    <!-- Filtros -->
    <div class="card border-0 rounded-4 mb-3">
      <div class="card-body py-2 d-flex flex-wrap gap-2 align-items-center">
        <div class="input-group input-group-sm" style="max-width:280px">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input class="form-control" id="fSearch" placeholder="Buscar ID, título o descripción…">
        </div>
        <select class="form-select form-select-sm w-auto" id="fUser"><option value="">Todas las personas</option></select>
        <select class="form-select form-select-sm w-auto" id="fPrio"><option value="">Toda prioridad</option></select>
        <select class="form-select form-select-sm w-auto" id="fCat"><option value="">Toda categoría</option></select>
        <div class="form-check form-switch ms-1 d-none" id="fMineWrap">
          <input class="form-check-input" type="checkbox" id="fMine"><label class="form-check-label small" for="fMine">Solo mis tickets</label>
        </div>
        <div class="ms-auto d-flex gap-2 align-items-center">
          <span class="small text-body-secondary" id="lastSync"></span>
          <button class="btn btn-sm btn-outline-secondary" id="btnRefresh" title="Actualizar"><i class="bi bi-arrow-clockwise"></i></button>
          <a class="btn btn-sm btn-primary d-none" id="btnNew" href="nuevo.html"><i class="bi bi-plus-lg"></i> Nuevo ticket</a>
        </div>
      </div>
    </div>

    <div class="alert alert-info py-2 small d-none" id="readOnlyMsg">
      <i class="bi bi-eye"></i> Estás en <b>modo lectura</b>. Inicia sesión con el botón <b>Login</b> para crear y dar seguimiento a tickets.
    </div>

    <!-- Tablero -->
    <div class="board" id="board">
      <div class="loading-overlay" style="grid-column:1/-1"><div class="spinner-border"></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script>
  /* =================== Tablero (MVC) =================== */
  const { ENV, Auth, Api, UI } = TFCA;
  const esc = UI.esc;

  /* ---------- Modelo ---------- */
  const Model = {
    tickets: [], byTicket: {}, checks: {},
    async load() {
      const d = await Api.list();
      this.tickets = d.tickets || [];
      this.byTicket = {}; this.checks = {};
      (d.seguimiento || []).forEach(e => (this.byTicket[e.ticketId] ||= []).push(e));
      (d.checklist || []).forEach(c => (this.checks[c.ticketId] ||= []).push(c));
      Object.values(this.byTicket).forEach(a => a.sort((x, y) => String(x.fecha).localeCompare(String(y.fecha))));
    },
    entries(id, tipo) { const a = this.byTicket[id] || []; return tipo ? a.filter(e => (Array.isArray(tipo) ? tipo.includes(e.tipo) : e.tipo === tipo)) : a; },
    filtered(f) {
      const me = Auth.current()?.user;
      const q = f.q.toLowerCase();
      return this.tickets.filter(t =>
        (!q || [t.id, t.titulo, t.descripcion].join(' ').toLowerCase().includes(q)) &&
        (!f.user || UI.splitList(t.asignados).includes(f.user) || t.creadoPor === f.user) &&
        (!f.prio || t.prioridad === f.prio) &&
        (!f.cat || t.categoria === f.cat) &&
        (!f.mine || UI.splitList(t.asignados).includes(me) || t.creadoPor === me));
    },
    find(id) { return this.tickets.find(t => t.id === id); }
  };

  /* ---------- Vista ---------- */
  const COLS = [
    { key: 'sinasignar', title: 'Sin asignar', icon: 'bi-inbox' },
    { key: 'pendiente', title: 'Pendientes', icon: 'bi-hourglass-split' },
    { key: 'proceso', title: 'En proceso', icon: 'bi-gear-wide-connected' },
    { key: 'cerrado', title: 'Cerrados', icon: 'bi-check2-circle' }
  ];
  const View = {
    kpis() {
      const T = Model.tickets, week = Date.now() - 7 * 864e5;
      const k = [
        ['Abiertos', T.filter(t => t.estado !== 'cerrado').length, 'bi-folder2-open', 'primary'],
        ['Sin asignar', T.filter(t => UI.column(t) === 'sinasignar').length, 'bi-inbox', 'secondary'],
        ['Vencidos', T.filter(t => UI.isOverdue(t)).length, 'bi-alarm', 'danger'],
        ['Cerrados (7 días)', T.filter(t => t.estado === 'cerrado' && new Date(t.cerrado) > week).length, 'bi-check2-all', 'success']
      ];
      document.getElementById('kpis').innerHTML = k.map(([l, n, i, c]) => `
        <div class="col-6 col-lg-3"><div class="card kpi"><div class="card-body d-flex align-items-center gap-3 py-2">
          <span class="fs-3 text-${c}"><i class="bi ${i}"></i></span>
          <div><div class="num">${n}</div><div class="small text-body-secondary">${l}</div></div>
        </div></div></div>`).join('');
    },
    card(t) {
      const coms = Model.entries(t.id, 'comentario').slice(-2);
      const imgs = Model.entries(t.id, 'imagen').length, files = Model.entries(t.id, 'archivo').length, code = Model.entries(t.id, 'codigo').length;
      const ch = Model.checks[t.id] || [], done = ch.filter(c => c.hecho === true || c.hecho === 'TRUE' || c.hecho === 'true').length;
      const drag = Auth.isLogged() ? 'draggable="true"' : '';
      return `
      <div class="tcard prio-${esc(t.prioridad)}" data-id="${esc(t.id)}" ${drag}>
        <div class="d-flex justify-content-between align-items-center gap-1">
          <span class="t-id">${esc(t.id)}</span>
          <span class="d-flex gap-1">${UI.isOverdue(t) ? '<span class="badge text-bg-danger"><i class="bi bi-alarm"></i> Vencido</span>' : ''}${UI.prioBadge(t.prioridad)}</span>
        </div>
        <div class="t-title">${esc(t.titulo)}</div>
        <div class="small text-body-secondary"><i class="bi bi-tag"></i> ${esc(t.categoria || '—')}${t.fechaLimite ? ` · <i class="bi bi-calendar-event"></i> ${esc(t.fechaLimite)}` : ''}</div>
        ${coms.map(c => `<div class="t-comment">${UI.avatar(c.autor, 20)}<span class="txt">${esc(c.texto)}</span></div>`).join('')}
        ${ch.length ? `<div class="d-flex align-items-center gap-2 mt-2"><div class="progress progress-thin flex-fill"><div class="progress-bar bg-success" style="width:${Math.round(done / ch.length * 100)}%"></div></div><span class="small text-body-secondary"><i class="bi bi-check2-square"></i> ${done}/${ch.length}</span></div>` : ''}
        <div class="t-foot">
          <span class="avatar-stack">${UI.avatars(t.asignados, 24) || '<span class="small text-body-secondary"><i class="bi bi-person-dash"></i> Nadie</span>'}</span>
          <span class="t-icons">
            ${code ? `<button class="t-icon" data-show="codigo" title="Código"><i class="bi bi-code-slash"></i> ${code}</button>` : ''}
            ${imgs ? `<button class="t-icon" data-show="imagen" title="Imágenes"><i class="bi bi-image"></i> ${imgs}</button>` : ''}
            ${files ? `<button class="t-icon" data-show="archivo" title="Archivos"><i class="bi bi-paperclip"></i> ${files}</button>` : ''}
          </span>
        </div>
      </div>`;
    },
    closedGroups(list) {
      // Agrupa por mes los cerrados que no caben en los visibles
      const g = {};
      list.forEach(t => { const k = (t.cerrado || t.actualizado || '').slice(0, 7) || 'Sin fecha'; (g[k] ||= []).push(t); });
      const fmt = k => { const d = new Date(k + '-01T12:00'); return isNaN(d) ? k : d.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }); };
      return Object.keys(g).sort().reverse().map((k, i) => `
        <div class="border rounded-3">
          <button class="btn btn-sm w-100 d-flex justify-content-between align-items-center" data-bs-toggle="collapse" data-bs-target="#cg${i}">
            <span class="text-capitalize"><i class="bi bi-archive"></i> ${esc(fmt(k))}</span><span class="badge text-bg-secondary">${g[k].length}</span>
          </button>
          <div class="collapse" id="cg${i}"><div class="p-1">
            ${g[k].map(t => `<div class="closed-mini" data-id="${esc(t.id)}"><span class="t-id">${esc(t.id)}</span><span class="text-truncate">${esc(t.titulo)}</span></div>`).join('')}
          </div></div>
        </div>`).join('');
    },
    board(list) {
      const by = { sinasignar: [], pendiente: [], proceso: [], cerrado: [] };
      list.forEach(t => by[UI.column(t)].push(t));
      const prioOrder = { 'Crítica': 0, 'Alta': 1, 'Media': 2, 'Baja': 3 };
      ['sinasignar', 'pendiente', 'proceso'].forEach(k => by[k].sort((a, b) => (prioOrder[a.prioridad] ?? 9) - (prioOrder[b.prioridad] ?? 9) || String(b.actualizado).localeCompare(String(a.actualizado))));
      by.cerrado.sort((a, b) => String(b.cerrado).localeCompare(String(a.cerrado)));
      const visibleClosed = by.cerrado.slice(0, ENV.CLOSED_VISIBLE), oldClosed = by.cerrado.slice(ENV.CLOSED_VISIBLE);

      document.getElementById('board').innerHTML = COLS.map(c => {
        const items = c.key === 'cerrado' ? visibleClosed : by[c.key];
        return `
        <section class="column" data-col="${c.key}">
          <div class="column-head"><span><i class="bi ${c.icon}"></i> ${c.title}</span><span class="badge rounded-pill text-bg-light border">${by[c.key].length}</span></div>
          <div class="column-body">
            ${items.length ? items.map(t => this.card(t)).join('') : '<div class="empty-col"><i class="bi bi-emoji-smile"></i><br>Nada por aquí</div>'}
            ${c.key === 'cerrado' && oldClosed.length ? `<div class="small text-body-secondary mt-1 mb-1"><i class="bi bi-collection"></i> ${oldClosed.length} cerrados anteriores</div>${this.closedGroups(oldClosed)}` : ''}
          </div>
        </section>`;
      }).join('');
    },
    /** Modal de detalle de solo lectura (comentarios + iconos) */
    detail(t) {
      const coms = Model.entries(t.id, ['comentario', 'sistema']);
      const ch = Model.checks[t.id] || [];
      const counts = ['codigo', 'imagen', 'archivo'].map(k => [k, Model.entries(t.id, k).length]);
      const icons = { codigo: ['bi-code-slash', 'Código'], imagen: ['bi-image', 'Imágenes'], archivo: ['bi-paperclip', 'Archivos'] };
      const html = `
        <div class="d-flex flex-wrap gap-2 mb-2">${UI.prioBadge(t.prioridad)}<span class="badge text-bg-light border">${esc(UI.ESTADOS[t.estado] || t.estado)}</span><span class="badge text-bg-light border"><i class="bi bi-tag"></i> ${esc(t.categoria)}</span>${UI.isOverdue(t) ? '<span class="badge text-bg-danger">Vencido</span>' : ''}</div>
        <p class="tl-text">${esc(t.descripcion) || '<i class="text-body-secondary">Sin descripción</i>'}</p>
        <div class="row small g-2 mb-3">
          <div class="col-sm-6"><b>Asignados:</b> <span class="avatar-stack">${UI.avatars(t.asignados, 22) || '—'}</span> ${UI.splitList(t.asignados).map(u => esc(UI.user(u).name)).join(', ')}</div>
          <div class="col-sm-6"><b>Creado por:</b> ${esc(UI.user(t.creadoPor).name)} · ${UI.fmtDate(t.creado)}</div>
          ${t.fechaLimite ? `<div class="col-sm-6"><b>Fecha límite:</b> ${esc(t.fechaLimite)}</div>` : ''}
          ${t.cerrado ? `<div class="col-sm-6"><b>Cerrado:</b> ${UI.fmtDate(t.cerrado)} por ${esc(UI.user(t.cerradoPor).name)}</div>` : ''}
        </div>
        ${ch.length ? `<h6><i class="bi bi-check2-square"></i> Checklist</h6><div class="mb-3">${ch.map(c => { const d = c.hecho === true || c.hecho === 'TRUE' || c.hecho === 'true'; return `<div class="check-item ${d ? 'done' : ''}"><i class="bi ${d ? 'bi-check-square-fill text-success' : 'bi-square'}"></i><span>${esc(c.texto)}</span></div>`; }).join('')}</div>` : ''}
        <div class="d-flex gap-2 mb-3">${counts.filter(([, n]) => n).map(([k, n]) => `<button class="btn btn-sm btn-outline-secondary" data-show="${k}" data-id="${esc(t.id)}"><i class="bi ${icons[k][0]}"></i> ${icons[k][1]} (${n})</button>`).join('')}</div>
        <h6><i class="bi bi-chat-left-text"></i> Comentarios</h6>
        <div class="timeline">${coms.length ? coms.map(e => UI.entryHtml(e)).join('') : '<span class="small text-body-secondary">Sin comentarios aún.</span>'}</div>`;
      const footer = Auth.isLogged()
        ? `<a class="btn btn-primary" href="ticket.html?id=${encodeURIComponent(t.id)}"><i class="bi bi-box-arrow-up-right"></i> Abrir y dar seguimiento</a>`
        : `<button class="btn btn-outline-primary" onclick="TFCA.Header.openLogin()"><i class="bi bi-box-arrow-in-right"></i> Inicia sesión para dar seguimiento</button>`;
      UI.modal(`<span class="t-id me-2">${esc(t.id)}</span>${esc(t.titulo)}`, html, { footer });
    },
    /** Modal con código, imágenes o archivos de un ticket */
    attachments(t, tipo) {
      const list = Model.entries(t.id, tipo);
      const titles = { codigo: '<i class="bi bi-code-slash"></i> Código', imagen: '<i class="bi bi-image"></i> Imágenes', archivo: '<i class="bi bi-paperclip"></i> Archivos' };
      let html;
      if (tipo === 'imagen') html = `<div class="row g-2">${list.map(e => `<div class="col-6 col-md-4"><a href="#" class="img-thumb d-block" data-img="${esc(UI.thumbUrl(e))}" data-full="${esc(UI.fileUrl(e))}" data-name="${esc(e.fileName)}"><img src="${esc(UI.thumbUrl(e))}" class="w-100" style="height:160px;object-fit:cover" referrerpolicy="no-referrer" loading="lazy"></a><div class="small text-truncate mt-1">${esc(e.fileName)} · ${UI.ago(e.fecha)}</div></div>`).join('')}</div>`;
      else html = `<div class="timeline">${list.map(e => UI.entryHtml(e)).join('')}</div>`;
      UI.modal(`${titles[tipo]} · <span class="t-id">${esc(t.id)}</span>`, html, { size: tipo === 'codigo' ? 'xl' : 'lg' });
    }
  };

  /* ---------- Controlador ---------- */
  const Controller = {
    filters() {
      return { q: fSearch.value.trim(), user: fUser.value, prio: fPrio.value, cat: fCat.value, mine: fMine.checked };
    },
    render() { View.kpis(); View.board(Model.filtered(this.filters())); },
    async refresh(silent) {
      try {
        await Model.load(); this.render();
        lastSync.textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        if (!silent) document.getElementById('board').innerHTML = `<div class="alert alert-danger" style="grid-column:1/-1"><i class="bi bi-exclamation-triangle"></i> ${esc(e.message)}</div>`;
      }
    },
    async move(id, col) {
      const t = Model.find(id); const me = Auth.current();
      if (!t || UI.column(t) === col) return;
      if (col === 'sinasignar') return UI.toast('Para dejarlo sin asignar, quita a los colaboradores desde el ticket.', 'warning');
      if (!Auth.canManage(t)) return UI.toast('Solo los asignados, el creador o un admin pueden mover este ticket.', 'warning');
      const fields = { estado: col };
      if (!UI.splitList(t.asignados).length) fields.asignados = [me.user]; // al tomarlo se asigna a quien lo mueve
      if (col === 'cerrado') {
        const ch = Model.checks[id] || [];
        const pend = ch.filter(c => !(c.hecho === true || c.hecho === 'TRUE' || c.hecho === 'true')).length;
        if (!confirm(pend ? `El checklist tiene ${pend} pendiente(s). ¿Cerrar de todos modos?` : `¿Cerrar ${id}?`)) return;
      }
      try { await Api.update(id, fields); UI.toast(`${id} → ${COLS.find(c => c.key === col).title}`); await this.refresh(); }
      catch (e) { UI.toast(e.message, 'danger'); }
    },
    bind() {
      // Filtros
      fUser.innerHTML += ENV.USERS.map(u => `<option value="${esc(u.user)}">${esc(u.name)}</option>`).join('');
      fPrio.innerHTML += ENV.PRIORIDADES.map(p => `<option>${esc(p)}</option>`).join('');
      fCat.innerHTML += ENV.CATEGORIAS.map(p => `<option>${esc(p)}</option>`).join('');
      [fSearch, fUser, fPrio, fCat, fMine].forEach(el => el.addEventListener('input', () => this.render()));
      btnRefresh.onclick = () => this.refresh();
      if (Auth.isLogged()) { btnNew.classList.remove('d-none'); fMineWrap.classList.remove('d-none'); }
      else readOnlyMsg.classList.remove('d-none');

      const board = document.getElementById('board');
      // Clicks: iconos → modal de adjuntos; tarjeta → detalle
      board.addEventListener('click', ev => {
        const show = ev.target.closest('[data-show]');
        const card = ev.target.closest('[data-id]');
        if (!card) return;
        const t = Model.find(card.dataset.id); if (!t) return;
        if (show) { ev.stopPropagation(); View.attachments(t, show.dataset.show); }
        else View.detail(t);
      });
      // Botones de adjuntos dentro del modal de detalle
      document.addEventListener('click', ev => {
        const b = ev.target.closest('.modal [data-show][data-id]');
        if (b) { const t = Model.find(b.dataset.id); bootstrap.Modal.getInstance(document.getElementById('uiModal'))?.hide(); setTimeout(() => View.attachments(t, b.dataset.show), 350); }
      });
      // Drag & drop (solo con sesión)
      if (Auth.isLogged()) {
        let dragId = null;
        board.addEventListener('dragstart', e => { const c = e.target.closest('.tcard'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
        board.addEventListener('dragend', e => { e.target.closest('.tcard')?.classList.remove('dragging'); document.querySelectorAll('.drop-hover').forEach(x => x.classList.remove('drop-hover')); });
        board.addEventListener('dragover', e => { const col = e.target.closest('.column'); if (col && dragId) { e.preventDefault(); document.querySelectorAll('.drop-hover').forEach(x => x !== col && x.classList.remove('drop-hover')); col.classList.add('drop-hover'); } });
        board.addEventListener('drop', e => { const col = e.target.closest('.column'); if (col && dragId) { e.preventDefault(); col.classList.remove('drop-hover'); this.move(dragId, col.dataset.col); dragId = null; } });
      }
      // Auto-actualización (si la pestaña está visible y no hay modales abiertos)
      setInterval(() => { if (!document.hidden && !UI.isModalOpen()) this.refresh(true); }, ENV.REFRESH_SECONDS * 1000);
    },
    async init() { TFCA.Header.render('tablero'); this.bind(); await this.refresh(); }
  };

  Controller.init();
  </script>
</body>
</html>
