<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de Accesos TFCA</title>
<!-- Dependencias por CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script>
  // Tema guardado en este navegador (compartido con Sistemas y Módulos): se aplica antes de pintar
  (function () {
    var t = null;
    try { t = localStorage.getItem('tfca_theme'); var p = JSON.parse(localStorage.getItem('tfca_areas_prefs') || '{}'); if (p.tema) t = p.tema; } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
</script>
<style>
  :root { --bg:#f3f5f7; --line:#d5dbe1; --verde:#2e7d32; --turnar:#e8702a; --aceptar:#1b6b2a;
          --surface:#ffffff; --surface-2:#fafbfc; --hover:#f2f7ff; --text:#1f2a33; --muted:#5f6b76; --muted-2:#98a2ad;
          --chip:#eceff1; --phead:#e8f5e9; --warn-bg:#fff8e1; --ok-bg:#c8e6c9; --ok-fg:#1b5e20; --code:#1b5e20;
          --brand:#8a1c3b; --brand-soft:#f4e3e8; }
  /* Tema oscuro (se guarda en este navegador; es el mismo de Sistemas y Módulos) */
  [data-bs-theme="dark"] { --bg:#111417; --line:#30363d; --verde:#66bb6a; --turnar:#f08a4b; --aceptar:#4caf50;
          --surface:#1a1e23; --surface-2:#20252b; --hover:#252b32; --text:#e6e9ec; --muted:#9aa5b1; --muted-2:#6c7781;
          --chip:#2a3037; --phead:#1d2a20; --warn-bg:#3a3320; --ok-bg:#1f3a24; --ok-fg:#8fd694; --code:#8fd694;
          --brand:#e07795; --brand-soft:#3b1f29; color-scheme:dark; }
  [data-bs-theme="dark"] .table-light { --bs-table-bg:#23292f; --bs-table-color:#dee2e6; --bs-table-border-color:#30363d; --bs-table-striped-bg:#2a3037; --bs-table-hover-bg:#2a3037; }
  [data-bs-theme="dark"] .btn-light { --bs-btn-bg:#262c33; --bs-btn-color:#dee2e6; --bs-btn-border-color:#3a414a; --bs-btn-hover-bg:#2f363e; --bs-btn-hover-color:#fff; --bs-btn-hover-border-color:#495057; --bs-btn-disabled-bg:#1f242a; --bs-btn-disabled-color:#6c7781; --bs-btn-disabled-border-color:#30363d; --bs-btn-active-bg:#343b43; }
  [data-bs-theme="dark"] .text-bg-light, [data-bs-theme="dark"] .badge.bg-light { background-color:#2f363e !important; color:#dee2e6 !important; }
  [data-bs-theme="dark"] .sortable-ghost { background:#1e3a55 !important; }
  [data-bs-theme="dark"] .fl-term { background:#cfd8dc; color:#111417; }
  body { background: var(--bg); color: var(--text); }

  /* ---------- Tablero (columnas tipo Kanban) ---------- */
  .board { display:flex; gap:16px; align-items:flex-start; overflow-x:auto; padding:16px; min-height:calc(100vh - 130px); }
  .board.es-matriz { display:block; }
  .col-board { flex:0 0 560px; max-width:calc(100vw - 32px); background:var(--surface); border:1px solid var(--line);
               border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; flex-direction:column;
               max-height:calc(100vh - 160px); }
  .compacto .col-board { flex-basis:380px; }
  .col-head { background:var(--c); color:#fff; padding:8px 10px; border-radius:9px 9px 0 0;
              display:flex; align-items:center; gap:6px; font-weight:600; }
  .col-handle { cursor:grab; opacity:.85; }
  .orden { font-size:.7rem; background:rgba(255,255,255,.25); border-radius:4px; padding:1px 5px; }
  .btn-spd { color:#fff; opacity:.6; padding:0 2px; line-height:1; }
  .btn-spd.tiene { opacity:1; }
  .spd-pop { min-width:240px; }

  /* ---------- Vista Módulos: grupo por módulo, sub-columnas por área ---------- */
  .board.vista-modulos { gap:0; align-items:stretch; }
  .mod-group { flex:0 0 auto; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line);
               border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); max-height:calc(100vh - 160px); }
  .mod-cols { display:flex; align-items:stretch; flex:1; min-height:0; }
  .sub-col { flex:0 0 430px; max-width:calc(100vw - 120px); display:flex; flex-direction:column; min-height:0; }
  .compacto .sub-col { flex-basis:310px; }
  .sub-head { background:color-mix(in srgb, var(--a) 20%, var(--surface)); border-left:4px solid var(--a); border-bottom:1px solid var(--line);
              font-weight:600; font-size:.8rem; padding:4px 8px; display:flex; justify-content:space-between; gap:6px; }
  .sub-col .ptable { flex:1; }

  /* Divisores de flujo: siempre Turnar | Aceptar entre columnas */
  .flujo { display:flex; flex:0 0 auto; align-self:stretch; }
  .board > .flujo { margin:0 8px; border-radius:6px; overflow:hidden; max-height:calc(100vh - 160px); }
  .flujo > div { width:30px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;
                 font-size:.75rem; letter-spacing:.06em; writing-mode:vertical-rl; transform:rotate(180deg); }
  .flujo-turnar  { background:var(--turnar); }
  .flujo-aceptar { background:var(--aceptar); }

  /* ---------- "Tabla" de empleados (grid para poder arrastrar filas) ---------- */
  .ptable { overflow-y:auto; font-size:.82rem; }
  .prow { display:grid; grid-template-columns:44px 125px 52px 1fr 1.3fr; border-bottom:1px solid var(--line); }
  .prow > div { padding:4px 6px; border-right:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow > div:last-child { border-right:0; }
  .c-perm { display:none; align-items:center; }
  .compacto .c-usuario, .compacto .c-idrol { display:none; }
  .compacto .prow { grid-template-columns:44px 1fr 1.2fr; }
  .con-perm .c-usuario, .con-perm .c-idrol { display:none; }
  .con-perm .c-perm { display:flex; }
  /* Vista Módulos: sin permisos visibles, solo la columna de la ✕ (con sesión) */
  .con-perm .prow, .compacto .con-perm .prow { grid-template-columns:40px 1fr 1.4fr 30px; }
  body:not(.editable) .con-perm .prow { grid-template-columns:40px 1fr 1.4fr; }
  body:not(.editable) .con-perm .c-perm { display:none; }
  .con-perm .c-perm { padding:0 !important; justify-content:center; }

  /* Vista Roles: módulos colapsados */
  .btn-mods { font-size:.75rem; padding:0 4px; text-decoration:none; }
  .btn-mods .bi-chevron-right { transition:transform .15s; display:inline-block; }
  .btn-mods.abierto .bi-chevron-right { transform:rotate(90deg); }

  /* Quitar persona de un módulo (aparece al pasar el mouse) */
  .btn-quitar { margin-left:auto; border:0; background:transparent; color:#c62828; padding:0 4px; line-height:1; opacity:0; }
  .prow:hover .btn-quitar, .btn-quitar:focus-visible { opacity:1; }
  @media (hover:none) { .btn-quitar { opacity:.7; } }

  /* Listas de selección en modales (personas / módulos) */
  .lista-sel { max-height:55vh; overflow:auto; }
  .sel-head { position:sticky; top:0; z-index:1; background:color-mix(in srgb, var(--a) 18%, var(--surface)); border-left:4px solid var(--a); cursor:pointer; }
  .item-sel { cursor:pointer; border-bottom:1px solid var(--hover); }
  .item-sel:hover { background:var(--hover); }
  .chip.parcial { opacity:.75; border-style:dashed; }

  .phead { background:var(--phead); color:var(--verde); font-weight:700; position:sticky; top:0; z-index:1; }
  .prow:not(.phead) { background:var(--surface); }
  .editable .prow:not(.phead) { cursor:pointer; }
  .editable .prow:not(.phead):hover { background:var(--hover); }
  .prow.drag { cursor:grab; }
  .prow.pendiente .c-nombre { color:var(--muted-2); font-style:italic; }
  .sub-acc { display:block; font-size:.68rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub-pick { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.75rem; padding:2px 0 4px 10px; }
  .sub-pick label { display:inline-flex; gap:4px; align-items:center; }
  .pbody { min-height:38px; }
  .pbody:empty::after { content:attr(data-empty); display:block; padding:10px; color:var(--muted-2); text-align:center; font-style:italic; }
  .sortable-ghost { opacity:.4; background:#e3f2fd !important; }

  .perm { display:inline-block; width:18px; text-align:center; border-radius:3px; font-size:.7rem; font-weight:700;
          margin-right:2px; background:var(--chip); color:var(--muted-2); }
  .perm.on { background:var(--ok-bg); color:var(--ok-fg); }
  .perm.v2 { background:#fff3cd; color:#8a6d00; }

  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .chip { font-size:.72rem; padding:2px 8px; border-radius:20px; background:color-mix(in srgb, var(--c) 14%, var(--surface));
          color:var(--c); border:1px solid color-mix(in srgb, var(--c) 40%, var(--surface)); font-weight:600; }

  .add-col { flex:0 0 200px; min-height:120px; border:2px dashed var(--line); border-radius:10px; background:transparent;
             color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .add-col:hover { border-color:var(--verde); color:var(--verde); }
  .vista-modulos .add-col { margin-left:16px; align-self:flex-start; }

  /* ---------- Matriz ---------- */
  .matriz-wrap th.mth { min-width:88px; font-size:.72rem; border-top:4px solid var(--c) !important; vertical-align:bottom; }
  .matriz-wrap td, .matriz-wrap th { font-size:.8rem; }
  .matriz-wrap tbody th { position:sticky; left:0; background:var(--surface); z-index:1; }
  .matriz-wrap td.parcial { background:var(--warn-bg); }
  .matriz-wrap tr.grupo th { background:var(--c); color:#fff; position:static; }
  .editable .matriz-wrap .form-check-input { cursor:pointer; }

  /* Elementos que solo existen con sesión iniciada */
  body:not(.editable) .solo-edicion { display:none !important; }

  #toast { position:fixed; bottom:16px; right:16px; z-index:2000; }

  /* ---------- Menú común con Sistemas y Módulos ---------- */
  .tb-brand { display:flex; align-items:center; gap:8px; font-weight:700; color:var(--text); text-decoration:none; white-space:nowrap; }
  .tb-brand b { color:var(--brand); }
  .tb-mark { width:28px; height:28px; border-radius:7px; background:#8a1c3b; color:#fff; display:grid; place-items:center; font-size:.9rem; }
  .tb-nav { display:flex; gap:2px; margin-right:6px; }
  .tb-nav a { color:var(--muted); text-decoration:none; font-size:.86rem; font-weight:600; padding:4px 10px; border-radius:7px; }
  .tb-nav a:hover { background:var(--hover); color:var(--text); }
  .tb-nav a.on { color:var(--brand); background:var(--brand-soft); }

  /* ---------- Acceso: sin sesión es solo lectura; el formulario se abre con "Login" ---------- */
  .gate-abierto #vistas, .gate-abierto #buscar, .gate-abierto .form-switch, .gate-abierto #sync,
  .gate-abierto .solo-edicion, .gate-abierto #board, .gate-abierto #barra-info { display:none !important; }
  #gate { display:grid; place-items:center; padding:8vh 16px 40px; }
  .gate-box { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 6px 18px rgba(0,0,0,.06); }
  .gate-box h2 { font-size:1.3rem; font-weight:700; margin:12px 0 6px; }

  /* ---------- Subsistemas (compartidos con Sistemas y Módulos) ---------- */
  .subs-bar { display:flex; align-items:center; gap:6px; padding:2px 8px; border-bottom:1px solid var(--line); font-size:.78rem; color:var(--muted); }
  .subs-list { display:flex; flex-wrap:wrap; gap:4px; padding:6px 8px; border-bottom:1px solid var(--line); }
  .chip-sub { border:1px solid color-mix(in srgb, var(--c) 40%, var(--surface)); cursor:pointer; }
  .chip-sub:disabled { cursor:default; }
  /* ---------- Vista Flujo ---------- */
  .board.es-flujo { display:block; }
  .fl-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .fl-diagrama { display:flex; align-items:center; gap:0; padding:6px 4px 20px; }
  .fl-diagrama.fl-h { flex-direction:row; overflow-x:auto; align-items:flex-start; }
  .fl-h > .fl-termwrap, .fl-h > .fl-arrow { align-self:flex-start; margin-top:64px; }
  .fl-termwrap { flex:none; display:flex; }
  .fl-v .fl-termwrap, .fl-v > .fl-arrow { width:340px; justify-content:center; }
  .fl-grupo { flex:none; display:flex; gap:12px; }
  .fl-h .fl-grupo { flex-direction:column; width:300px; }
  .fl-v .fl-grupo { flex-direction:row; align-items:flex-start; }
  .fl-hijos { display:flex; gap:10px; }
  .fl-h .fl-hijos { flex-direction:column; padding-left:14px; border-left:2px dashed color-mix(in srgb, var(--muted) 45%, transparent); margin-left:10px; }
  .fl-v .fl-hijos { flex-direction:row; padding-top:12px; border-top:2px dashed color-mix(in srgb, var(--muted) 45%, transparent); }
  .fl-node.hijo { border-top-width:3px; border-top-style:dashed; }
  .fl-h .fl-node.hijo { width:100%; }
  .fl-v .fl-node.hijo { width:300px; }
  .fl-node.pila { box-shadow:0 2px 6px rgba(0,0,0,.07), 6px 6px 0 -1px var(--surface), 6px 6px 0 0 var(--line), 12px 12px 0 -1px var(--surface), 12px 12px 0 0 var(--line); margin-bottom:12px; }
  .fl-toggle { border:0; border-top:1px solid var(--line); background:color-mix(in srgb, var(--c) 7%, var(--surface)); color:var(--c); font-size:.76rem; font-weight:600; padding:6px 10px; text-align:left; }
  .fl-toggle:hover { background:color-mix(in srgb, var(--c) 14%, var(--surface)); }
  .fl-spds { display:flex; flex-direction:column; gap:3px; }
  .fl-spds-head { display:flex; align-items:center; gap:6px; font-size:.68rem; font-weight:700; letter-spacing:.06em; color:var(--muted); }
  .fl-spd-item { display:block; font-size:.78rem; color:var(--code); background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--c); border-radius:4px; padding:2px 7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fl-user { position:relative; }
  .fl-user .btn-quitar { position:absolute; right:8px; top:4px; }
  .fl-user:hover .btn-quitar { opacity:1; }
  .fl-diagrama.fl-v { flex-direction:column; align-items:flex-start; padding-left:8px; overflow-x:auto; }
  .fl-term { flex:none; background:#37474f; color:#fff; font-weight:700; font-size:.78rem; letter-spacing:.12em; padding:10px 22px; border-radius:999px; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .fl-node { flex:none; width:300px; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--c); border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,.07); min-width:0; }
  .fl-v .fl-node.principal { flex:none; width:340px; }
  .fl-head { padding:10px 12px 8px; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--c) 9%, var(--surface)); border-radius:6px 6px 0 0; }
  .fl-paso { display:flex; justify-content:space-between; font-size:.68rem; font-weight:700; letter-spacing:.08em; color:var(--c); }
  .fl-paso span { color:var(--muted); font-weight:600; letter-spacing:0; }
  .fl-head h3 { font-size:1rem; font-weight:700; margin:3px 0 1px; line-height:1.25; color:var(--text); }
  .fl-sis { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .fl-meta { padding:8px 12px; display:flex; flex-direction:column; gap:5px; border-bottom:1px solid var(--line); }
  .fl-spd { display:flex; align-items:center; gap:6px; width:100%; text-align:left; border:1px dashed color-mix(in srgb, var(--c) 45%, var(--surface)); background:var(--surface-2); border-radius:6px; padding:4px 8px; font-size:.78rem; color:var(--text); }
  .fl-spd:not(:disabled):hover { border-style:solid; }
  .fl-spd span { font-weight:700; font-size:.68rem; letter-spacing:.06em; color:var(--muted); }
  .fl-spd code { color:var(--code); font-size:.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fl-spd.vacio code { color:var(--muted-2); font-style:italic; font-family:inherit; }
  .fl-arch { display:flex; gap:6px; align-items:center; font-size:.74rem; color:var(--muted); font-family:var(--bs-font-monospace); overflow:hidden; }
  .fl-arch span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fl-users { padding:6px 0 8px; flex:1; }
  .fl-users-head { display:flex; justify-content:space-between; align-items:center; padding:2px 12px 6px; font-size:.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .fl-area { margin:4px 12px 2px; padding-left:7px; border-left:3px solid var(--a); font-size:.68rem; font-weight:700; color:var(--muted); letter-spacing:.04em; }
  .fl-user { display:flex; gap:8px; align-items:flex-start; padding:4px 12px; cursor:default; }
  body.editable .fl-user { cursor:pointer; }
  body.editable .fl-user:hover { background:var(--hover); }
  .fl-id { flex:none; min-width:30px; text-align:center; font-size:.72rem; font-weight:700; background:var(--chip); color:var(--text); border-radius:4px; padding:2px 4px; margin-top:1px; }
  .fl-u { min-width:0; display:flex; flex-direction:column; }
  .fl-u b { font-size:.8rem; font-weight:600; line-height:1.2; overflow-wrap:anywhere; }
  .fl-u small { font-size:.7rem; color:var(--muted); overflow-wrap:anywhere; }
  .fl-user.pendiente b { color:var(--muted-2); font-style:italic; }
  .fl-vacio { padding:6px 12px; font-size:.78rem; color:var(--muted-2); font-style:italic; }
  .fl-foot { display:flex; gap:4px; padding:8px 10px; border-top:1px solid var(--line); background:var(--surface-2); border-radius:0 0 10px 10px; }
  .fl-arrow { flex:none; display:flex; align-items:center; justify-content:center; gap:4px; color:#90a4ae; }
  .fl-h > .fl-arrow { flex-direction:column; width:64px; }
  .fl-v > .fl-arrow { flex-direction:row; height:54px; }
  .fl-lbl { font-size:.56rem; font-weight:700; letter-spacing:.08em; }
  .fl-lbl:first-child { color:var(--turnar); } .fl-lbl:last-child { color:var(--aceptar); }
  .fl-line { position:relative; background:#90a4ae; }
  .fl-h .fl-line { width:46px; height:2px; } .fl-v .fl-line { width:2px; height:34px; }
  .fl-line::after { content:""; position:absolute; border:6px solid transparent; }
  .fl-h .fl-line::after { right:-6px; top:-5px; border-left:8px solid #90a4ae; border-right:0; }
  .fl-v .fl-line::after { bottom:-6px; left:-5px; border-top:8px solid #90a4ae; border-bottom:0; }
  @media print {
    body > *:not(#board) { display:none !important; }
    .board.es-flujo { padding:0; min-height:0; overflow:visible; }
    .fl-bar, .fl-foot { display:none !important; }
    .fl-diagrama.fl-h { flex-wrap:wrap; overflow:visible; row-gap:16px; }
    .fl-node { break-inside:avoid; box-shadow:none; }
  }
  .carga { display:flex; align-items:center; gap:14px; margin:40px auto; padding:18px 22px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .btn-ocultar { opacity:.7; } .btn-ocultar:hover { opacity:1; }
  .oculto-col { opacity:.8; } .oculto-col small { font-weight:400; }
  .col-head-sub { align-items:flex-start; }
  .col-head-sub .handle, .col-head-sub .col-handle, .col-head-sub .orden { margin-top:3px; }
  .min-w-0 { min-width:0; }
  .sub-titulo { font-size:1rem; line-height:1.25; }
  .sis-mini { display:block; max-width:100%; border:0; background:none; padding:0; color:rgba(255,255,255,.82); font-size:.7rem; font-weight:500; letter-spacing:.02em; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sis-mini:not(:disabled):hover { color:#fff; text-decoration:underline; }
  .folder-tag { font-family:ui-monospace, Consolas, monospace; font-size:.7rem; background:rgba(255,255,255,.25); border-radius:4px; padding:1px 5px; }

  /* ---------- Confirmación dentro de la página ---------- */
  .cfm { position:fixed; inset:0; z-index:3000; background:rgba(15,20,25,.5); display:grid; place-items:center; padding:16px; }
  .cfm-box { background:var(--surface); border-radius:12px; padding:20px; max-width:440px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.2); }
</style>
</head>
<body>

<!-- ================= Barra superior ================= -->
<header class="bg-body border-bottom px-3 py-2 d-flex flex-wrap gap-2 align-items-center">
  <a class="tb-brand" href="areas.html" title="Sistemas y Módulos TFCA"><span class="tb-mark"><i class="bi bi-layers"></i></span>Accesos <b>TFCA</b></a>
  <!-- Mismo menú que Sistemas y Módulos -->
  <nav class="tb-nav" aria-label="Secciones">

  return {

const Compartido = {
  /** entidad: 'sistemas' | 'modulos'. Sin id = nuevo. Con id = actualiza solo los campos enviados. */
  async guardar(entidad, fila) {
    if (MODO === 'drive') return llamarApi('save', { entity:entidad, data:fila });

    if (!fila.id) fila = { ...fila, id:Math.max(0, ...col.map(x => +x.id || 0)) + 1 };
    const i = col.findIndex(x => +x.id === +fila.id);
    if (i < 0) col.push(fila); else col[i] = { ...col[i], ...fila };
    escribirSisLocal(d);
    return i < 0 ? fila : col[i];

  async eliminar(entidad, id) {

/* Empleados ordenados: por orden de área, luego por orden de rol, luego por ID */
function empleadosOrdenados() {
  const pos = (col, id) => { const i = col.findIndex(x => x.id === id); return i < 0 ? 999 : i; };
  return [...db.empleados].sort((a, b) =>
    pos(db.areas, a.areaId) - pos(db.areas, b.areaId) || pos(db.roles, a.rolId) - pos(db.roles, b.rolId) || a.id - b.id);
}

const Ocultos = {
  get() { return new Set(db.subs.filter(x => x.oculto).map(x => x.id)); },
  has(id) { return !!db.subs.find(x => x.id === id)?.oculto; },

  toggle(id, ocultar, msg) { const s = this.get(); ocultar ? s.add(id) : s.delete(id); this.set(s, msg); }

/* ---------------- Vista Flujo: diagrama de flujo de los módulos (subsistemas) ----------------
   INICIO → grupo 1 → grupo 2 → … → FIN. Cada grupo tiene un módulo principal (el que sigue el flujo
   TURNAR / ACEPTAR) y, opcionalmente, módulos agrupados debajo (horizontal) o al mismo nivel (vertical),
   que se pueden plegar como una pila de tarjetas. Datos en la hoja Modulos:
   orden_flujo (orden), grupo_flujo (id del módulo principal) y spd (uno o varios, separados por coma). */
let flujoDir = leerPref('flujoDir', 'h');
const Plegados = {
  get() { try { return new Set(JSON.parse(leerPref('flujoPlegados', '[]')).map(Number)); } catch (e) { return new Set(); } },
  toggle(id) { const s = this.get(); s.has(id) ? s.delete(id) : s.add(id); guardarPref('flujoPlegados', JSON.stringify([...s])); }
};
const SPD_SEP = /[,;\n]+/;
const spdsDe = sb => sb.spds || [];
/** Módulo principal del grupo al que pertenece (null = es principal) */
const cabezaDe = sb => (sb.grupo && sb.grupo !== sb.id && db.subs.find(x => x.id === sb.grupo && !(x.grupo && x.grupo !== x.id && db.subs.some(y => y.id === x.grupo)))) || null;
/** Estructura completa (incluye ocultos): [{ cab, hijos }] en el orden del flujo */
function gruposFlujo() {
  const lista = subsFlujo();
  return lista.filter(x => !cabezaDe(x)).map(cab => ({ cab, hijos:lista.filter(x => cabezaDe(x) === cab) }));
}
/** Renumera orden_flujo siguiendo los grupos y guarda solo lo que cambió (orden y grupo) */
function guardarEstructura(grupos, msg = 'Flujo guardado') {
  const cambios = []; let n = 0;
  grupos.forEach(g => [g.cab, ...g.hijos].forEach((x, k) => {
    const grupo = k === 0 ? null : g.cab.id; n++;
    if (x.flujo !== n || (x.grupo ?? null) !== grupo) { x.flujo = n; x.grupo = grupo; cambios.push(x); }
  }));
  render();
  if (cambios.length) return compartir(async () => {
    for (const x of cambios) await Compartido.guardar('modulos', { id:x.id, orden_flujo:x.flujo, grupo_flujo:x.grupo ?? '' });
  }, msg);
}
/** Arrastre de columnas (vista anterior): reordena los principales visibles */
function guardarFlujo(idsVisibles) {
  const gs = gruposFlujo(), vis = idsVisibles.map(id => gs.find(g => g.cab.id === id)).filter(Boolean), set = new Set(vis);
  let k = 0; guardarEstructura(gs.map(g => set.has(g) ? vis[k++] : g), 'Orden del flujo guardado');
}
/** Lo que se dibuja: grupos con al menos un módulo visible (y que coincida con la búsqueda) */
function pasosFlujo(lista) {
  const ocultos = Ocultos.get();
  const info = sb => ({ sb, m:modDe(sb.idSistema), gente:lista.filter(p => tieneSub(p.id, sb) && coincide(p)) });
  const coincideMod = i => !filtro || i.gente.length || `${i.sb.nombre} ${i.m.nombre} ${spdsDe(i.sb).join(' ')}`.toLowerCase().includes(filtro);
  return gruposFlujo().map(g => {
    const miembros = [g.cab, ...g.hijos].filter(x => !ocultos.has(x.id)).map(info).filter(coincideMod);
    return miembros.length ? { g, cab:miembros[0], hijos:miembros.slice(1) } : null;
  }).filter(Boolean);
}
function moverGrupo(cabId, dir) {
  const gs = gruposFlujo(), ids = new Set(pasosFlujo(empleadosOrdenados()).map(p => p.g.cab.id)), visibles = gs.filter(g => ids.has(g.cab.id));
  const i = visibles.findIndex(g => g.cab.id === cabId), j = i + dir;
  if (i < 0 || j < 0 || j >= visibles.length) return;
  const a = gs.indexOf(visibles[i]), b = gs.indexOf(visibles[j]);
  [gs[a], gs[b]] = [gs[b], gs[a]];
  guardarEstructura(gs, 'Orden del flujo guardado');
}
function moverHijo(subId, dir) {
  const gs = gruposFlujo(), g = gs.find(x => x.hijos.some(h => h.id === subId)); if (!g) return;
  const ocultos = Ocultos.get(), vis = g.hijos.filter(h => !ocultos.has(h.id));
  const i = vis.findIndex(h => h.id === subId), j = i + dir;
  if (i < 0 || j < 0 || j >= vis.length) return;
  const a = g.hijos.indexOf(vis[i]), b = g.hijos.indexOf(vis[j]);
  [g.hijos[a], g.hijos[b]] = [g.hijos[b], g.hijos[a]];
  guardarEstructura(gs, 'Orden del grupo guardado');
}
/** Colocar un módulo debajo de otro (mismo grupo) o devolverlo al flujo como paso propio */
function agruparModulo(subId) {
  if (!PUEDE_EDITAR) return;
  const sb = db.subs.find(x => x.id === subId); if (!sb) return;
  const gs = gruposFlujo(), mio = gs.find(g => g.cab === sb), actual = cabezaDe(sb);
  const pasos = pasosFlujo(empleadosOrdenados()), nPaso = id => pasos.findIndex(p => p.g.cab.id === id) + 1;
  const opciones = gs.filter(g => g.cab !== sb).map(g => {
    const n = nPaso(g.cab.id);
    return `<option value="${g.cab.id}" ${actual === g.cab ? 'selected' : ''}>${n ? 'Paso ' + n : 'Oculto'} · ${esc(g.cab.nombre)} (${esc(modDe(g.cab.idSistema)?.nombre || '')})</option>`;
  }).join('');
  const hijos = mio ? mio.hijos : [];
  abrirModal(`Agrupar · ${sb.nombre}`, `
    <form id="f" class="row g-2">
      <div class="col-12"><label class="form-label small">Colocar este módulo</label>
        <select name="cab" class="form-select">
          <option value="" ${actual ? '' : 'selected'}>Como paso propio del flujo (no agrupado)</option>
          <optgroup label="Debajo de (mismo grupo)">${opciones}</optgroup>
        </select></div>
      <div class="col-12 small text-muted">El módulo principal de cada grupo es el que sigue el flujo TURNAR / ACEPTAR; los agrupados quedan
        ${flujoDir === 'v' ? 'a su lado, en el mismo nivel' : 'debajo de él'} y se pueden plegar.
        ${hijos.length ? `<br><b>Tiene ${hijos.length} módulo(s) agrupado(s)</b>; si lo colocas debajo de otro, se van con él al nuevo grupo.` : ''}</div>
      <button hidden></button>
    </form>`, {
    async guardar() {
      const destino = num(new FormData($('#f')).get('cab'));
      if ((actual?.id ?? null) === destino) return;
      const lista = gruposFlujo();
      const origen = lista.find(g => g.cab === sb || g.hijos.includes(sb));
      const llevar = origen.cab === sb ? [sb, ...origen.hijos] : [sb];
      // Quitar de donde estaba
      let pos = lista.indexOf(origen);
      if (origen.cab === sb) lista.splice(pos, 1); else origen.hijos = origen.hijos.filter(h => h !== sb);
      if (destino) {
        const g = lista.find(x => x.cab.id === destino);
        g.hijos.push(...llevar);
        await guardarEstructura(lista, `«${sb.nombre}» agrupado debajo de «${g.cab.nombre}»`);
      } else {
        lista.splice(origen.cab === sb ? pos : pos + 1, 0, { cab:sb, hijos:[] });
        await guardarEstructura(lista, `«${sb.nombre}» ahora es un paso propio del flujo`);
      }
    }
  });
}

      <button class="btn btn-sm btn-outline-secondary" data-fl-plegar="0" title="Desplegar todos los grupos"><i class="bi bi-arrows-expand"></i> Desplegar</button>
      <button class="btn btn-sm btn-outline-secondary" data-fl-print><i class="bi bi-printer"></i> Imprimir / PDF</button>
      <span class="small text-muted">${pasos.length} paso${pasos.length === 1 ? '' : 's'} · ${pasos.reduce((n, p) => n + 1 + p.hijos.length, 0)} módulos${ocultos ? ` · ${ocultos} oculto(s)` : ''}${filtro ? ' · filtrado por la búsqueda' : ''}</span>
    </div>`;
  if (!pasos.length) return barra + `<div class="p-4 text-muted">No hay módulos para mostrar${filtro ? ' con esa búsqueda' : ''}.</div>`;
  const term = t => `<div class="fl-termwrap"><div class="fl-term">${t}</div></div>`;
  return barra + `<div class="fl-diagrama fl-${flujoDir}">${term('INICIO')}${flecha}${pasos.map(grupoHtml).join(flecha)}${flecha}${term('FIN')}</div>`;
}
/** SPD de un módulo: uno o varios (columna spd de la hoja Modulos, separados por coma) */
function editarSpdSub(subId) {
  const sb = db.subs.find(x => x.id === subId); if (!sb || !PUEDE_EDITAR) return;
  const fila = (v = '') => `<div class="input-group input-group-sm mb-2" data-spd-row><span class="input-group-text"><i class="bi bi-database"></i></span>
      <input name="spd" class="form-control font-monospace" value="${esc(v)}" placeholder="Ej. SP_ALTA_PROMOCION" autocomplete="off">
      <button type="button" class="btn btn-outline-danger" data-spd-del title="Quitar"><i class="bi bi-x-lg"></i></button></div>`;
  abrirModal(`SPD · ${sb.nombre}`, `
    <form id="f">
      <div id="spdLista">${(spdsDe(sb).length ? spdsDe(sb) : ['']).map(fila).join('')}</div>
      <button type="button" class="btn btn-sm btn-outline-success" id="spdAdd"><i class="bi bi-plus-lg"></i> Agregar otro SPD</button>
      <div class="small text-muted mt-2">Un módulo puede usar varios SPD. Se guardan en la hoja Modulos (columna spd, separados por coma). Deja vacío para quitarlos.</div>
      <button hidden></button>
    </form>`, {
    async guardar() {
      const spds = [...new Set([...modalEl.querySelectorAll('[name="spd"]')].map(i => i.value.trim()).filter(Boolean).flatMap(v => v.split(SPD_SEP).map(x => x.trim()).filter(Boolean)))];
      if (spds.join(',') === spdsDe(sb).join(',')) return;
      sb.spds = spds; render();
      await compartir(() => Compartido.guardar('modulos', { id:sb.id, spd:spds.join(', ') }), spds.length ? `${spds.length} SPD guardado(s) en «${sb.nombre}»` : 'SPD eliminados');
    }
  });
  const body = modalEl.querySelector('.modal-body');
  body.onclick = e => {
    if (e.target.closest('#spdAdd')) { $('#spdLista').insertAdjacentHTML('beforeend', fila()); return $('#spdLista').lastElementChild.querySelector('input').focus(); }
    const del = e.target.closest('[data-spd-del]');
    if (del) { const rows = document.querySelectorAll('#spdLista [data-spd-row]'); if (rows.length > 1) del.closest('[data-spd-row]').remove(); else rows[0].querySelector('input').value = ''; }
  };
  body.onkeydown = e => { if (e.key === 'Enter' && e.target.name === 'spd') { e.preventDefault(); $('#spdAdd').click(); } };
}

/* Vista Módulos: un grupo por SUBSISTEMA (cabecera = subsistema, abajo el sistema en pequeño),
   en el orden del flujo (orden_flujo de la hoja Modulos) y dividido en sub-columnas por área */
function subsFlujo() {
  const posSis = id => { const i = db.modulos.findIndex(m => m.id === id); return i < 0 ? 999 : i; };
  return db.subs.filter(s => modDe(s.idSistema)).sort((a, b) =>
    (a.flujo ?? 1e9) - (b.flujo ?? 1e9) || posSis(a.idSistema) - posSis(b.idSistema) || (a.orden ?? 999) - (b.orden ?? 999) || a.id - b.id);
}
/** ¿Tiene acceso al subsistema? Permiso al sistema sin lista = todos sus subsistemas */
const tieneSub = (u, sub) => { const x = permiso(u, sub.idSistema); return !!x && (!subsIds(x).length || subsIds(x).includes(sub.id)); };
function darSub(u, sub) {
  const x = permiso(u, sub.idSistema);
  if (!x) { db.permisos.push({ ...PERM_COMPLETO(u, sub.idSistema), s:String(sub.id) }); return true; }
  const ids = subsIds(x);
  if (!ids.length || ids.includes(sub.id)) return false;      // ya tenía acceso
  x.s = [...ids, sub.id].join(','); return true;
}
function sacarSub(u, sub) {
  const x = permiso(u, sub.idSistema); if (!x) return;
  const ids = subsIds(x).length ? subsIds(x) : subsDe(sub.idSistema).map(s => s.id);
  const resto = ids.filter(id => id !== sub.id);
  if (resto.length) x.s = resto.join(','); else db.permisos = db.permisos.filter(p => p !== x);
}
function htmlModulos(lista) {
  const grupos = [];
  const subs = subsFlujo(), ocultos = Ocultos.get();
  subs.forEach((sb, n) => {
    if (ocultos.has(sb.id)) return;
    const m = modDe(sb.idSistema);
    const gente = lista.filter(p => tieneSub(p.id, sb) && coincide(p));
    if (filtro && !gente.length && !`${sb.nombre} ${m.nombre}`.toLowerCase().includes(filtro)) return;
    const cols = [];
    db.areas.forEach(a => { const g = gente.filter(p => p.areaId === a.id); if (g.length) cols.push({ area:a, gente:g }); });
    const sinArea = gente.filter(p => !areaDe(p.areaId));
    if (sinArea.length) cols.push({ area:null, gente:sinArea });
    if (!cols.length) cols.push({ area:undefined, gente:[] });
    const html = cols.map(c => `
      <div class="sub-col">
        <div class="sub-head" style="--a:${c.area?.color || '#90a4ae'}">
          <span class="text-truncate">${esc(c.area ? c.area.nombre : c.area === null ? 'SIN ÁREA' : 'SIN PERSONAS')}</span>
          <span class="badge text-bg-light">${c.gente.length}</span>
        </div>
        <div class="ptable">${encabezado}
          <div class="pbody" data-col="${sb.id}" data-empty="${PUEDE_EDITAR ? 'Arrastra personas aquí para darles acceso' : 'Sin personas'}">${c.gente.map(p => fila(p, { drag:true, sub:sb.id })).join('')}</div>
        </div>
      </div>`).join(divisor());
    grupos.push(`<section class="mod-group" data-key="sub" data-id="${sb.id}" data-sis="${m.id}">
      <header class="col-head col-head-sub" style="--c:${m.color}">
        ${handle('Arrastrar para ordenar el flujo')}
        <span class="orden" title="Paso en el flujo">#${n + 1}</span>
        <span class="flex-grow-1 min-w-0">
          <span class="d-block text-truncate sub-titulo" title="${esc(sb.nombre)}">${esc(sb.nombre)}</span>
          <button type="button" class="sis-mini" data-act="edit-sis" title="${PUEDE_EDITAR ? 'Editar sistema' : 'Sistema'} ${esc(m.nombre)}" ${PUEDE_EDITAR ? '' : 'disabled'}>${m.id} · ${esc(m.nombre)}</button>
        </span>
        ${sb.archivo ? `<span class="folder-tag" title="Archivo del subsistema">${esc(sb.archivo)}</span>` : ''}
        <button class="btn btn-sm btn-link btn-spd ${spdsDe(sb).length ? 'tiene' : ''}" data-act="spd-sub" ${PUEDE_EDITAR ? '' : 'disabled'} title="${spdsDe(sb).length ? 'SPD: ' + esc(spdsDe(sb).join(', ')) : 'SPD (opcional)'}"><i class="bi ${spdsDe(sb).length ? 'bi-database-fill-check' : 'bi-database'}"></i></button>
        <span class="badge bg-light text-dark">${gente.length}</span>
        ${PUEDE_EDITAR ? `<button class="btn btn-sm btn-link text-white p-0" data-act="personas" title="Agregar o quitar personas"><i class="bi bi-person-plus"></i></button>` : ''}
        ${btnEditar()}
        ${PUEDE_EDITAR ? `<button class="btn btn-sm btn-link text-white p-0 ms-1 btn-ocultar" data-act="ocultar" title="Ocultar este módulo (para todos)"><i class="bi bi-eye-slash"></i></button>` : ''}
      </header>
      <div class="mod-cols">${html}</div>
    </section>`);
  });
  if (ocultos.size && subs.some(x => ocultos.has(x.id))) {
    const n = subs.filter(x => ocultos.has(x.id)).length;
    grupos.push(PUEDE_EDITAR
      ? `<button class="add-col oculto-col" data-act="ver-ocultos"><i class="bi bi-eye fs-3"></i><span>${n} módulo${n === 1 ? '' : 's'} oculto${n === 1 ? '' : 's'}<br><small>Elegir cuáles mostrar</small></span></button>`
      : `<div class="add-col oculto-col"><i class="bi bi-eye-slash fs-3"></i><span>${n} módulo${n === 1 ? '' : 's'} oculto${n === 1 ? '' : 's'}<br><small>Inicia sesión para mostrarlos</small></span></div>`);
  }
  if (!subs.length) grupos.push(`<div class="p-4 text-muted">No hay subsistemas. ${PUEDE_EDITAR ? 'Agrégalos con «+ Módulo» o en Sistemas y Módulos.' : 'Se agregan en Sistemas y Módulos.'}</div>`);
  return grupos.join(divisor()) + btnAgregar('módulo (subsistema)');
}

/* Subsistemas del módulo (hoja Modulos, compartida con Sistemas y Módulos) */
function barraSubs(m) {
  const subs = subsDe(m.id), abierto = subsAbiertos.has(m.id);
  return `<div class="subs-bar">
      <button class="btn btn-sm btn-link btn-mods p-0 ${abierto ? 'abierto' : ''}" data-act="toggle-subs" aria-expanded="${abierto}">
        <i class="bi bi-chevron-right"></i> ${subs.length} subsistema${subs.length === 1 ? '' : 's'}${PUEDE_EDITAR ? ' · editar' : ''}</button>
      <a class="ms-auto small" href="areas.html#sistema-${m.id}" title="Abrir en Sistemas y Módulos"><i class="bi bi-box-arrow-up-right"></i> Sistemas</a>
    </div>
    ${abierto ? `<div class="subs-list">
      ${subs.map(s => `<button type="button" class="chip chip-sub" style="--c:${m.color}" data-act="edit-sub" data-sub="${s.id}" ${PUEDE_EDITAR ? '' : 'disabled'}
          title="${esc(s.archivo || 'Sin archivo')}${db.cardsPorSub[s.id] ? ` · ${db.cardsPorSub[s.id]} card(s)` : ''}">${s.id} · ${esc(s.nombre)}</button>`).join('') || '<span class="small text-muted">Sin subsistemas</span>'}
      ${PUEDE_EDITAR ? `<button type="button" class="btn btn-sm btn-link p-0 ms-auto" data-act="add-sub"><i class="bi bi-plus-circle"></i> Subsistema</button>` : ''}
    </div>` : ''}`;
}

function htmlMatriz() {
  const th = db.modulos.map(m => `<th class="mth text-center" style="--c:${m.color}">${esc(m.nombre)}</th>`).join('');
  let areaActual, filas = '';
  for (const p of empleadosOrdenados().filter(coincide)) {
    if (p.areaId !== areaActual) {
      areaActual = p.areaId;
      const a = areaDe(p.areaId);
      filas += `<tr class="grupo" style="--c:${a?.color || '#78909c'}"><th colspan="${db.modulos.length + 2}">${esc(a?.nombre || 'SIN ÁREA')}</th></tr>`;
    }
    const tds = db.modulos.map(m => {
      const x = permiso(p.id, m.id);
      const parcial = x && FLAGS.some(([k]) => x[k] !== 1);
      return `<td class="text-center ${parcial ? 'parcial' : ''}" title="${x ? FLAGS.map(([k, t]) => `${t}: ${x[k]}`).join(' · ') : 'Sin acceso'}">
        <input class="form-check-input" type="checkbox" data-u="${p.id}" data-m="${m.id}" ${x ? 'checked' : ''} ${PUEDE_EDITAR ? '' : 'disabled'}></td>`;
    }).join('');
    filas += `<tr><th class="text-nowrap" data-pid="${p.id}">${p.id} · ${esc(nombreCompleto(p) || '(sin datos)')}
      <div class="small text-muted fw-normal">${esc(rolDe(p.rolId)?.nombre || 'SIN ROL')}</div></th>${tds}
      <td class="text-center fw-semibold">${modulosDe(p.id).length}</td></tr>`;
  }
  const tot = db.modulos.map(m => `<td class="text-center fw-semibold">${empleadosDeModulo(m.id).filter(coincide).length}</td>`).join('');
  return `<div class="matriz-wrap card shadow-sm"><div class="table-responsive">
    <table class="table table-bordered table-sm align-middle mb-0">
      <thead class="table-light"><tr><th>Empleado \\ Módulo</th>${th}<th class="text-center">Total</th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot class="table-light"><tr><th>Personas con acceso</th>${tot}<td></td></tr></tfoot>
    </table></div></div>`;
}

/* ---------------- Render principal ---------------- */
function render() {
  cerrarPopover();
  const v = VISTAS[vista];
  if (MODO === 'drive' && !driveListo && !cargaFallida) {      // primera carga desde Google Sheets
    $('#board').className = 'board';
    $('#board').innerHTML = `<div class="carga" role="status"><div class="spinner-border text-success" aria-hidden="true"></div>
      <div><b>Cargando accesos…</b><div class="small text-muted" id="cargaSub">Leyendo áreas, roles, empleados y módulos de Google Sheets.</div></div></div>`;
    return;
  }
  document.body.classList.toggle('editable', PUEDE_EDITAR);
  document.body.classList.toggle('compacto', $('#chkCompacto').checked);
  document.querySelectorAll('.solo-local').forEach(el => el.classList.toggle('d-none', MODO !== 'local'));
  document.querySelectorAll('#vistas [data-vista]').forEach(b => b.classList.toggle('active', b.dataset.vista === vista));
  $('#btnCol').innerHTML = `<i class="bi bi-plus-lg"></i> ${v.nuevo}`;
  { const n = db.subs.filter(x => Ocultos.has(x.id)).length, b = $('#btnVisibles');
    b.classList.toggle('d-none', vista !== 'flujo' || !PUEDE_EDITAR);
    b.classList.toggle('btn-warning', n > 0); b.classList.toggle('btn-outline-secondary', !n);
    b.querySelector('span').textContent = n ? `Módulos visibles (${n} ocultos)` : 'Módulos visibles'; }
  $('#hint').textContent = PUEDE_EDITAR ? v.hint : HINT_LECTURA;
  const pend = db.empleados.filter(p => !nombreCompleto(p)).length;
  $('#resumen').textContent = `${db.areas.length} áreas · ${db.modulos.length} sistemas · ${db.subs.length} módulos · ${db.roles.length} roles · ${db.empleados.length} empleados (${pend} sin datos) · ${db.permisos.length} permisos`;

  const board = $('#board');
  board.classList.toggle('es-matriz', vista === 'matriz');
  board.classList.toggle('es-flujo', vista === 'flujo');
  board.classList.toggle('con-perm', vista === 'modulos');
  board.classList.toggle('vista-modulos', vista === 'modulos');
  if (vista === 'matriz') { board.innerHTML = htmlMatriz(); return; }

  const lista = empleadosOrdenados();
  if (vista === 'modulos') { board.innerHTML = htmlModulos(lista); initSortable(); return; }
  if (vista === 'flujo') { board.innerHTML = htmlFlujo(lista); return; }

  let cols = [];
  if (vista === 'areas') {
    cols = db.areas.map(a => columna({ key:'area', id:a.id, titulo:a.nombre, color:a.color, orden:a.orden,
      lista: lista.filter(p => p.areaId === a.id), drag:true }));
    const sin = lista.filter(p => !areaDe(p.areaId));
    if (sin.filter(coincide).length) cols.push(columna({ key:'area', id:0, titulo:'SIN ÁREA', color:'#78909c', lista:sin, drag:true, fija:true }));
  }
  else { // roles
    cols = db.roles.map(r => {
      const a = areaDe(r.areaId);
      // Módulos del rol = módulos que tienen sus personas (completo o parcial)
      const miembros = db.empleados.filter(p => p.rolId === r.id);
      const chips = db.modulos.map(m => {
        const n = miembros.filter(p => permiso(p.id, m.id)).length;
        if (!n) return '';
        const todos = n === miembros.length;
        return `<span class="chip ${todos ? '' : 'parcial'}" style="--c:${m.color}" title="${n} de ${miembros.length} personas del rol">${esc(m.nombre)}${todos ? '' : ` ${n}/${miembros.length}`}</span>`;
      }).join('');
      const nMods = (chips.match(/class="chip/g) || []).length;
      const abierto = rolesAbiertos.has(r.id);
      // Por defecto solo se ve el área del rol; los módulos se despliegan con el botón
      const extra = `<div class="px-2 py-1 border-bottom small text-muted d-flex align-items-center gap-1 flex-wrap">
          <span>Área del rol:</span>
          ${a ? `<span class="chip" style="--c:${a.color}">${esc(a.nombre)}</span>` : '<span>sin área</span>'}
          <button class="btn btn-sm btn-link btn-mods ms-auto ${abierto ? 'abierto' : ''}" data-act="toggle-mods"
                  aria-expanded="${abierto}" title="${abierto ? 'Ocultar' : 'Ver'} módulos del rol">
            <i class="bi bi-chevron-right"></i> ${nMods} módulo${nMods === 1 ? '' : 's'}</button>
        </div>
        ${abierto ? `<div class="px-2 py-2 border-bottom d-flex flex-wrap gap-1 align-items-center">
          ${chips || '<span class="small text-muted">Sin módulos</span>'}
          ${PUEDE_EDITAR ? `<button class="btn btn-sm btn-link p-0 ms-auto" data-act="modulos-rol" title="Dar o quitar módulos a todo el rol"><i class="bi bi-sliders"></i> Asignar</button>` : ''}
        </div>` : ''}`;
      return columna({ key:'rol', id:r.id, titulo:`${r.id} · ${r.nombre}`, color:r.color, orden:r.orden,
        lista: lista.filter(p => p.rolId === r.id), drag:true, extra });
    });
    const sin = lista.filter(p => !rolDe(p.rolId));
    if (sin.filter(coincide).length) cols.push(columna({ key:'rol', id:0, titulo:'SIN ROL', color:'#78909c', lista:sin, drag:true, fija:true }));
  }

  board.innerHTML = cols.join('') + btnAgregar(v.nuevo.toLowerCase());
  initSortable();
}

/* ---------------- Drag & drop (SortableJS) — solo con sesión ---------------- */
function initSortable() {
  if (!PUEDE_EDITAR) return;
  const board = $('#board');
  const selector = vista === 'modulos' ? '.mod-group' : '.col-board:not(.fija)';

  // Reordenar columnas: solo actualiza "orden", nunca el id
  Sortable.create(board, {
    animation:150, handle:'.col-handle', draggable:selector,
    onEnd() {
      const ids = [...board.querySelectorAll(selector)].map(el => +el.dataset.id);
      if (vista === 'modulos') {
        // Orden del flujo de subsistemas: se guarda en Modulos.orden_flujo (compartido)
        return guardarFlujo(ids);   // los ocultos (o filtrados) conservan su lugar
      }
      const col = VISTAS[vista].coleccion();
      const antes = new Map(col.map(x => [x.id, x.orden]));
      col.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      renumerar(col);
      render();
      if (VISTAS[vista].key === 'modulo') {
        // El orden de los módulos es el orden de los sistemas: se ve igual en Sistemas y Módulos
        const cambiados = col.filter(x => antes.get(x.id) !== x.orden);
        compartir(async () => { for (const x of cambiados) await Compartido.guardar('sistemas', { id:x.id, orden:x.orden }); }, 'Orden de módulos guardado');
      } else cambio();
    }
  });

  if (vista === 'modulos') {
    // Se COPIA: arrastrar da acceso al módulo destino sin quitar el de origen
    board.querySelectorAll('.pbody').forEach(el => {
      const sb = db.subs.find(x => x.id === +el.dataset.col);
      Sortable.create(el, {
        group:{ name:'mod', pull:'clone', put:true }, sort:false, animation:150,
        filter:'.btn-quitar', preventOnFilter:false,
        onAdd(e) {
          const u = +e.item.dataset.pid; e.item.remove();
          if (!sb || !darSub(u, sb)) { toast('Ya tenía acceso a ese módulo'); render(); return; }
          cambio(); render();
          toast(`${nombreCompleto(empDe(u)) || 'Usuario ' + u} → ${sb.nombre}`);
        }
      });
    });
    return;
  }

  const campo = VISTAS[vista].campo;
  board.querySelectorAll('.pbody').forEach(el => Sortable.create(el, {
    group:'empleados', animation:150, sort:false,
    onEnd(e) {
      if (e.from === e.to) return;
      const p = empDe(+e.item.dataset.pid);
      p[campo] = +e.to.dataset.col || null;
      cambio(); render();
      const destino = campo === 'areaId' ? areaDe(p[campo])?.nombre : rolDe(p[campo])?.nombre;
      toast(`${nombreCompleto(p) || 'Usuario ' + p.id} → ${destino || 'sin asignar'}`);
    }
  }));
}

/* ---------------- Popover del SPD (vista Módulos) ---------------- */
let popActual = null;
function cerrarPopover() { if (popActual) { popActual.dispose(); popActual = null; } }
function abrirSpd(btn, modId) {
  const m = modDe(modId);
  if (popActual && popActual._element === btn) return cerrarPopover();
  cerrarPopover();
  const content = PUEDE_EDITAR
    ? `<form class="spd-pop" data-spd-form="${m.id}">
         <label class="form-label small mb-1">Nombre del SPD <span class="text-muted">(opcional)</span></label>
         <input class="form-control form-control-sm" name="spd" value="${esc(m.spd || '')}" placeholder="Ej. SP_ALTA_PROMOCION" autocomplete="off">
         <div class="d-flex gap-1 mt-2 justify-content-end">
           <button type="button" class="btn btn-sm btn-light" data-spd-cerrar>Cancelar</button>
           <button type="submit" class="btn btn-sm btn-success">Guardar</button>
         </div>
       </form>`
    : `<div class="small">${m.spd ? `<code>${esc(m.spd)}</code>` : '<span class="text-muted">Sin SPD registrado</span>'}</div>`;
  popActual = new bootstrap.Popover(btn, { html:true, sanitize:false, trigger:'manual', placement:'bottom', container:'body',
    title:`SPD · ${esc(m.nombre)}`, content });
  popActual.show();
  setTimeout(() => document.querySelector('.popover [name="spd"]')?.focus(), 50);
}
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-spd-form]'); if (!f) return;
  e.preventDefault();
  const m = modDe(+f.dataset.spdForm);
  m.spd = f.spd.value.trim();
  cambio(); render(); toast(m.spd ? `SPD guardado: ${m.spd}` : 'SPD eliminado');
});
document.addEventListener('click', e => {
  if (e.target.closest('[data-spd-cerrar]')) return cerrarPopover();
  if (popActual && !e.target.closest('.popover') && !e.target.closest('[data-act="spd"]')) cerrarPopover();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarPopover(); });

/* ---------------- Modal genérico ---------------- */
const modalEl = $('#modal');
const modal = new bootstrap.Modal(modalEl);
let acciones = {};
function abrirModal(titulo, cuerpo, acc, { grande = false } = {}) {
  acciones = acc;
  modalEl.querySelector('.modal-dialog').classList.toggle('modal-lg', grande);
  modalEl.querySelector('.modal-title').textContent = titulo;
  const body = modalEl.querySelector('.modal-body');
  body.innerHTML = cuerpo;
  body.onchange = body.oninput = body.onclick = null; // cada modal registra los suyos
  $('#mError').textContent = '';
  $('#mEliminar').classList.toggle('d-none', !acc.eliminar);
  modal.show();
}
const error = msg => { $('#mError').textContent = msg; return false; };
/** Botón con indicador de carga mientras se guarda */
async function conCarga(btn, fn, texto = 'Guardando…') {
  if (btn.disabled) return;
  const html = btn.innerHTML; btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>${texto}`;
  try { return await fn(); } finally { btn.disabled = false; btn.removeAttribute('aria-busy'); btn.innerHTML = html; }
}
$('#mGuardar').onclick = () => conCarga($('#mGuardar'), async () => { if (await acciones.guardar?.() !== false) modal.hide(); });
$('#mEliminar').onclick = async () => { if (await acciones.eliminar?.() !== false) modal.hide(); };
modalEl.addEventListener('submit', e => { e.preventDefault(); $('#mGuardar').click(); });
modalEl.addEventListener('shown.bs.modal', () => modalEl.querySelector('.modal-body input, .modal-body select')?.focus());

const opciones = (arr, sel, vacio) =>
  (vacio ? `<option value="">${vacio}</option>` : '') +
  arr.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${x.id} · ${esc(x.nombre)}</option>`).join('');

/* ---------------- Formularios (solo con sesión) ---------------- */
function editarEmpleado(p) {
  if (!PUEDE_EDITAR) return;
  const nuevo = !p;
  const base = p || emp(nextId(db.empleados), '', '', '', '', null, null);
  const permisosTabla = db.modulos.map(m => {
    const x = permiso(base.id, m.id);
    const subs = subsDe(m.id), sel = subsIds(x);
    return `<tr><td class="small">${m.id} · ${esc(m.nombre)}</td>${FLAGS.map(([k]) =>
      `<td class="text-center"><input class="form-check-input" type="checkbox" name="p_${m.id}_${k}" ${x && x[k] > 0 ? 'checked' : ''}></td>`).join('')}</tr>
      ${subs.length ? `<tr class="table-light"><td colspan="5"><div class="sub-pick"><span class="text-muted">Subsistemas:</span>${subs.map(s =>
        `<label><input class="form-check-input mt-0" type="checkbox" name="s_${m.id}" value="${s.id}" ${sel.includes(s.id) ? 'checked' : ''}>${esc(s.nombre)}</label>`).join('')}</div></td></tr>` : ''}`;
  }).join('');

  abrirModal(nuevo ? 'Nuevo empleado' : 'Editar empleado', `
    <form id="f" class="row g-2">
      <div class="col-3"><label class="form-label small">ID</label><input name="id" type="number" min="1" class="form-control" value="${base.id}"></div>
      <div class="col-9"><label class="form-label small">Usuario</label><input name="usuario" class="form-control text-uppercase" value="${esc(base.usuario)}"></div>
      <div class="col-md-4"><label class="form-label small">Nombre(s)</label><input name="nombre" class="form-control text-uppercase" value="${esc(base.nombre)}"></div>
      <div class="col-md-4"><label class="form-label small">Apellido paterno</label><input name="paterno" class="form-control text-uppercase" value="${esc(base.paterno)}"></div>
      <div class="col-md-4"><label class="form-label small">Apellido materno</label><input name="materno" class="form-control text-uppercase" value="${esc(base.materno)}"></div>
      <div class="col-6"><label class="form-label small">Rol</label><select name="rolId" class="form-select">${opciones(db.roles, base.rolId, 'Sin rol')}</select></div>
      <div class="col-6"><label class="form-label small">Área</label><select name="areaId" class="form-select">${opciones(db.areas, base.areaId, 'Sin área')}</select></div>
      <div class="col-12 mt-3">
        <div class="fw-semibold small mb-1">Permisos por módulo</div>
        <table class="table table-sm table-bordered mb-0">
          <thead class="table-light"><tr><th>Módulo</th><th class="text-center">Consultar</th><th class="text-center">Insertar</th><th class="text-center">Actualizar</th><th class="text-center">Eliminar</th></tr></thead>
          <tbody>${permisosTabla}</tbody>
        </table>
        <div class="small text-muted mt-1">Sin subsistemas marcados = acceso a todo el sistema. Marca uno o varios para limitarlo a esos subsistemas.</div>
      </div>
      <button hidden></button>
    </form>`, {
    guardar() {
      const f = new FormData($('#f'));
      const id = +f.get('id');
      const up = k => (f.get(k) || '').trim().toUpperCase();
      if (!id) return error('El ID es obligatorio.');
      if (db.empleados.some(x => x.id === id && x !== p)) return error('Ese ID ya existe.');
      const nuevos = [];
      for (const m of db.modulos) {
        const ant = permiso(base.id, m.id);
        const x = { u:id, m:m.id };
        FLAGS.forEach(([k]) => { x[k] = f.get(`p_${m.id}_${k}`) ? (ant && ant[k] > 0 ? ant[k] : 1) : 0; });
        x.s = f.getAll(`s_${m.id}`).join(',');
        if (x.s && !FLAGS.some(([k]) => x[k] > 0)) x.c = 1;   // marcar un subsistema da al menos "consultar"
        if (FLAGS.some(([k]) => x[k] > 0)) nuevos.push(x);
      }
      const datos = { id, usuario:up('usuario'), nombre:up('nombre'), paterno:up('paterno'), materno:up('materno'),
                      rolId:num(f.get('rolId')), areaId:num(f.get('areaId')) };
      // Conserva permisos a módulos que no están en el catálogo actual
      db.permisos = db.permisos.filter(x => x.u !== base.id || !modDe(x.m)).map(x => x.u === base.id ? { ...x, u:id } : x).concat(nuevos);
      if (nuevo) db.empleados.push(datos); else Object.assign(p, datos);
      cambio(); render(); toast(nuevo ? 'Empleado agregado' : 'Cambios guardados');
    },
    eliminar: nuevo ? null : async () => {
      if (!await confirmar(`¿Eliminar a ${nombreCompleto(p) || 'usuario ' + p.id} y sus permisos?`)) return false;
      db.empleados = db.empleados.filter(x => x !== p);
      db.permisos = db.permisos.filter(x => x.u !== p.id);
      cambio(); render(); toast('Empleado eliminado');
    }
  }, { grande:true });
}

/* ---------------- Asignaciones rápidas (solo con sesión) ---------------- */
const PERM_COMPLETO = (u, m) => ({ u, m, c:1, i:1, a:1, e:1 });
function restaurarPermisos(antes) { db.permisos = antes; cambio(); render(); toast('Cambio deshecho'); }

/* ✕ en una fila de la vista Módulos */
function quitarDeModulo(u, modId) {
  if (!PUEDE_EDITAR) return;
  const antes = structuredClone(db.permisos);
  db.permisos = db.permisos.filter(x => !(x.u === u && x.m === modId));
  cambio(); render();
  toast(`${nombreCompleto(empDe(u)) || 'Usuario ' + u} ya no tiene acceso a ${modDe(modId).nombre}`, { deshacer:() => restaurarPermisos(antes) });
}

function quitarDeSub(u, subId) {
  if (!PUEDE_EDITAR) return;
  const sb = db.subs.find(x => x.id === subId); if (!sb) return;
  const antes = structuredClone(db.permisos);
  sacarSub(u, sb); cambio(); render();
  toast(`${nombreCompleto(empDe(u)) || 'Usuario ' + u} ya no tiene acceso a ${sb.nombre}`, { deshacer:() => restaurarPermisos(antes) });
}
/* Vista Módulos (subsistemas): agregar o quitar personas */
function asignarPersonasSub(subId) {
  if (!PUEDE_EDITAR) return;
  const sb = db.subs.find(x => x.id === subId); if (!sb) return;
  asignarPersonas(sb.idSistema, sb);
}

/* Vista Módulos: agregar o quitar personas de un módulo */
function asignarPersonas(modId, sb = null) {
  if (!PUEDE_EDITAR) return;
  const m = sb ? { nombre:sb.nombre } : modDe(modId);
  const tiene = p => sb ? tieneSub(p.id, sb) : !!permiso(p.id, modId);
  const lista = empleadosOrdenados();
  const grupos = [...db.areas.map(a => ({ a, gente:lista.filter(p => p.areaId === a.id) })),
                  { a:null, gente:lista.filter(p => !areaDe(p.areaId)) }].filter(g => g.gente.length);
  const html = grupos.map(g => `
    <div data-grupo>
      <label class="sel-head d-flex align-items-center gap-2 fw-semibold small py-1 px-2" style="--a:${g.a?.color || '#90a4ae'}">
        <input type="checkbox" class="form-check-input m-0" data-todos> ${esc(g.a?.nombre || 'SIN ÁREA')}
        <span class="badge text-bg-light ms-auto">${g.gente.length}</span>
      </label>
      ${g.gente.map(p => `
        <label class="item-sel d-flex align-items-center gap-2 small py-1 px-3"
               data-texto="${esc(`${p.id} ${p.usuario} ${nombreCompleto(p)} ${rolDe(p.rolId)?.nombre || ''}`.toLowerCase())}">
          <input type="checkbox" class="form-check-input m-0" name="u" value="${p.id}" ${tiene(p) ? 'checked' : ''}>
          <span class="text-muted" style="width:42px">${p.id}</span>
          <span class="flex-grow-1 text-truncate ${nombreCompleto(p) ? '' : 'fst-italic text-muted'}">${esc(nombreCompleto(p) || '(SIN DATOS DE EMPLEADO)')}</span>
          <span class="text-muted text-truncate" style="max-width:40%">${esc(rolDe(p.rolId)?.nombre || 'SIN ROL')}</span>
        </label>`).join('')}
    </div>`).join('');

  abrirModal(`Personas con acceso a "${m.nombre}"`, `
    <form id="f">
      <input class="form-control form-control-sm mb-2" id="fBuscar" placeholder="Buscar por ID, usuario, nombre o rol…" autocomplete="off">
      <div class="lista-sel border rounded">${html || '<div class="p-3 small text-muted">No hay empleados registrados.</div>'}</div>
      <div class="small text-muted mt-2">Las personas que agregues reciben todos los permisos (C·I·A·E); ajústalos desde la ficha de cada persona.</div>
      <button hidden></button>
    </form>`, {
    guardar() {
      const sel = new Set([...modalEl.querySelectorAll('[name="u"]:checked')].map(c => +c.value));
      const antes = structuredClone(db.permisos);
      const agregar = db.empleados.filter(p => sel.has(p.id) && !tiene(p));
      const quitar = new Set(db.empleados.filter(p => !sel.has(p.id) && tiene(p)).map(p => p.id));
      if (!agregar.length && !quitar.size) return;
      if (sb) { agregar.forEach(p => darSub(p.id, sb)); quitar.forEach(u => sacarSub(u, sb)); }
      else db.permisos = db.permisos.filter(x => !(x.m === modId && quitar.has(x.u))).concat(agregar.map(p => PERM_COMPLETO(p.id, modId)));
      cambio(); render();
      toast(`${m.nombre}: +${agregar.length} / −${quitar.size} personas`, { deshacer:() => restaurarPermisos(antes) });
    }
  }, { grande:true });

  // "Todos" por área + buscador
  const body = modalEl.querySelector('.modal-body');
  const visibles = g => [...g.querySelectorAll('[name="u"]')].filter(c => !c.closest('.item-sel').classList.contains('d-none'));
  const sync = g => {
    const cs = visibles(g), n = cs.filter(c => c.checked).length, t = g.querySelector('[data-todos]');
    t.checked = cs.length > 0 && n === cs.length; t.indeterminate = n > 0 && n < cs.length;
  };
  body.querySelectorAll('[data-grupo]').forEach(sync);
  body.onchange = e => {
    const g = e.target.closest('[data-grupo]'); if (!g) return;
    if (e.target.matches('[data-todos]')) visibles(g).forEach(c => c.checked = e.target.checked);
    sync(g);
  };
  body.oninput = e => {
    if (e.target.id !== 'fBuscar') return;
    const q = e.target.value.trim().toLowerCase();
    body.querySelectorAll('[data-grupo]').forEach(g => {
      g.querySelectorAll('.item-sel').forEach(it => it.classList.toggle('d-none', !!q && !it.dataset.texto.includes(q)));
      g.classList.toggle('d-none', !visibles(g).length);
      sync(g);
    });
  };
}

/* Vista Roles: dar o quitar módulos a todas las personas del rol */
function asignarModulosRol(rolId) {
  if (!PUEDE_EDITAR) return;
  const r = rolDe(rolId);
  const miembros = db.empleados.filter(p => p.rolId === rolId);
  if (!miembros.length) return toast('Este rol no tiene personas. Arrastra personas al rol primero.');
  const filas = db.modulos.map(m => {
    const n = miembros.filter(p => permiso(p.id, m.id)).length;
    return `<label class="item-sel d-flex align-items-center gap-2 small py-1 px-2">
      <input type="checkbox" class="form-check-input m-0" name="m" value="${m.id}" data-n="${n}" ${n === miembros.length ? 'checked' : ''}>
      <span class="dot" style="background:${m.color}"></span>
      <span class="flex-grow-1">${m.id} · ${esc(m.nombre)}</span>
      <span class="badge ${n === miembros.length ? 'text-bg-success' : n ? 'text-bg-warning' : 'text-bg-light'}" title="Personas del rol con este módulo">${n}/${miembros.length}</span>
    </label>`;
  }).join('');

  abrirModal(`Módulos del rol "${r.nombre}"`, `
    <form id="f">
      <div class="small mb-2">Se aplica a las <b>${miembros.length}</b> personas de este rol:
        <span class="text-muted">${miembros.map(p => esc(nombreCompleto(p) || 'Usuario ' + p.id)).join(', ')}</span></div>
      <div class="lista-sel border rounded">${filas}</div>
      <div class="small text-muted mt-2">
        <b>Marcado</b>: todos lo tienen · <b>Vacío</b>: nadie lo tiene · <b>Guion</b>: solo algunos (si no lo tocas, se respeta).
        Los accesos nuevos van con todos los permisos (C·I·A·E).
      </div>
      <button hidden></button>
    </form>`, {
    guardar() {
      const antes = structuredClone(db.permisos);
      let mas = 0, menos = 0;
      modalEl.querySelectorAll('[name="m"]').forEach(c => {
        if (c.indeterminate) return; // parcial y sin tocar: se deja igual
        const mId = +c.value;
        miembros.forEach(p => {
          const tiene = !!permiso(p.id, mId);
          if (c.checked && !tiene) { db.permisos.push(PERM_COMPLETO(p.id, mId)); mas++; }
          if (!c.checked && tiene) { db.permisos = db.permisos.filter(x => !(x.u === p.id && x.m === mId)); menos++; }
        });
      });
      if (!mas && !menos) return;
      cambio(); render();
      toast(`${r.nombre}: +${mas} / −${menos} accesos`, { deshacer:() => restaurarPermisos(antes) });
    }
  });
  // Los módulos que solo tienen algunas personas se muestran con guion
  modalEl.querySelectorAll('[name="m"]').forEach(c => { const n = +c.dataset.n; c.indeterminate = n > 0 && n < miembros.length; });
}

function editarColumna(key, id) {
  if (!PUEDE_EDITAR) return;
  const col = key === 'area' ? db.areas : key === 'modulo' ? db.modulos : db.roles;
  const etiqueta = { area:'área', modulo:'sistema', rol:'rol' }[key];
  const nuevo = id == null;
  const it = nuevo
    ? { id:nextId(col), nombre:'', orden:siguienteOrden(col), color:PALETA[col.length % PALETA.length], areaId:null, folder:'', spd:'' }
    : col.find(x => x.id === id);
  const esModulo = key === 'modulo';
  const subs = esModulo && !nuevo ? subsDe(it.id) : [];
  abrirModal(`${nuevo ? 'Nuevo' : 'Editar'} ${etiqueta}`, `
    <form id="f" class="row g-2">
      <div class="col-3"><label class="form-label small">ID</label><input name="id" type="number" min="1" class="form-control" value="${it.id}" ${esModulo && !nuevo ? 'readonly title="El ID del módulo se comparte con Sistemas y Módulos y no se cambia"' : ''}></div>
      <div class="col-7"><label class="form-label small">Nombre</label><input name="nombre" class="form-control text-uppercase" value="${esc(it.nombre)}"></div>
      <div class="col-2"><label class="form-label small">Color</label><input name="color" type="color" class="form-control form-control-color w-100" value="${it.color}"></div>
      <div class="col-4"><label class="form-label small">Orden (solo vista)</label><input name="orden" type="number" min="1" class="form-control" value="${it.orden ?? ''}"></div>
      ${esModulo ? `
        <div class="col-8"><label class="form-label small">Folder</label><input name="folder" class="form-control text-uppercase" value="${esc(it.folder || '')}"></div>
        <div class="col-12"><label class="form-label small">SPD <span class="text-muted">(opcional)</span></label><input name="spd" class="form-control" value="${esc(it.spd || '')}"></div>
        ${nuevo ? '' : `<div class="col-12 mt-2"><div class="fw-semibold small mb-1">Subsistemas (${subs.length})</div>
          <div class="d-flex flex-wrap gap-1 align-items-center">${subs.map(s => `<button type="button" class="chip chip-sub" style="--c:${it.color}" data-sub-edit="${s.id}" title="Editar subsistema${s.archivo ? ' · ' + esc(s.archivo) : ''}">${s.id} · ${esc(s.nombre)} <i class="bi bi-pencil"></i></button>`).join('') || '<span class="small text-muted">Sin subsistemas</span>'}
            <button type="button" class="btn btn-sm btn-link p-0 ms-1" data-sub-add><i class="bi bi-plus-circle"></i> Subsistema</button></div>
          <div class="small text-muted mt-1">Clic en un subsistema para editarlo, moverlo a otro módulo o eliminarlo.</div></div>`}
        <div class="col-12 small text-muted">Este módulo es un <b>sistema</b>: los cambios se ven también en Sistemas y Módulos.</div>` : ''}
      ${key === 'rol' ? `<div class="col-8"><label class="form-label small">Área del rol</label><select name="areaId" class="form-select">${opciones(db.areas, it.areaId, 'Sin área')}</select></div>` : ''}
      ${esModulo ? '' : '<div class="col-12 small text-muted">Cambiar el orden no modifica ningún id ni relación.</div>'}
      <button hidden></button>
    </form>`, {
    async guardar() {
      const f = new FormData($('#f'));
      const nombre = f.get('nombre').trim().toUpperCase();
      const nuevoId = esModulo && !nuevo ? it.id : +f.get('id');
      if (!nuevoId) return error('El ID es obligatorio.');
      if (!nombre) return error('El nombre es obligatorio.');
      if (col.some(x => x.id === nuevoId && x !== it)) return error('Ese ID ya existe.');
      if (!nuevo && nuevoId !== it.id) {
        if (!await confirmar(`Cambiar el id ${it.id} → ${nuevoId} actualizará todas sus referencias. ¿Continuar?`)) return false;
        if (key === 'area')   { db.empleados.forEach(p => { if (p.areaId === it.id) p.areaId = nuevoId; });
                                db.roles.forEach(r => { if (r.areaId === it.id) r.areaId = nuevoId; }); }
        if (key === 'rol')      db.empleados.forEach(p => { if (p.rolId === it.id) p.rolId = nuevoId; });
      }
      Object.assign(it, { id:nuevoId, nombre, color:f.get('color'), orden:num(f.get('orden')) ?? siguienteOrden(col) });
      if (key === 'rol') it.areaId = num(f.get('areaId')); else delete it.areaId;
      if (esModulo) { it.folder = (f.get('folder') || '').trim().toUpperCase(); it.spd = (f.get('spd') || '').trim(); }
      else { delete it.folder; delete it.spd; }
      if (nuevo) col.push(it);
      ordenar(); render();
      if (esModulo) {
        const fila = { id:it.id, nombre:it.nombre, folder:it.folder, orden:it.orden, spd:it.spd, color:it.color };
        if (nuevo) Object.assign(fila, { estatus:1, fecha_alta:stamp(), descripcion:'' });
        await compartir(() => Compartido.guardar('sistemas', fila), nuevo ? 'Módulo agregado (también en Sistemas)' : 'Cambios guardados (también en Sistemas)');
      } else { cambio(); toast(nuevo ? `${etiqueta} agregado` : 'Cambios guardados'); }
    },
    eliminar: nuevo ? null : async () => {
      if (esModulo && subsDe(it.id).length)
        return error(`Tiene ${subsDe(it.id).length} subsistema(s). Muévelos o elimínalos antes de borrar el módulo.`);
      if (!await confirmar(`¿Eliminar ${etiqueta} "${it.nombre}"? Los empleados no se borran.${esModulo ? ' También se quitan sus permisos y desaparece de Sistemas y Módulos.' : ''}`)) return false;
      col.splice(col.indexOf(it), 1);
      if (key === 'area')   { db.empleados.forEach(p => { if (p.areaId === it.id) p.areaId = null; });
                              db.roles.forEach(r => { if (r.areaId === it.id) r.areaId = null; }); }
      if (key === 'rol')      db.empleados.forEach(p => { if (p.rolId === it.id) p.rolId = null; });
      if (key === 'modulo')   db.permisos = db.permisos.filter(x => x.m !== it.id);
      cambio(); render();
      if (esModulo) compartir(() => Compartido.eliminar('sistemas', it.id), 'Módulo eliminado');
      else toast(`${etiqueta} eliminado`);
    }
  });
  if (esModulo && !nuevo) modalEl.querySelector('.modal-body').onclick = e => {
    const b = e.target.closest('[data-sub-edit],[data-sub-add]'); if (!b) return;
    editarSub(b.dataset.subEdit ? +b.dataset.subEdit : null, it.id);
  };
}

/* ---------------- Subsistemas (hoja Modulos compartida) ---------------- */
function editarSub(subId, sistemaId) {
