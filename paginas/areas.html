<!doctype html>
<html lang="es">
<head>
<title>Sistemas y Módulos TFCA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%238a1c3b'/><path d='M9 10h14M16 10v13' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior fija + migas; cada nivel (Sistemas → Módulos → Cards) abre con métricas y luego su contenido.
   Las cards se leen como entradas de bitácora: título, autor, texto, código y adjuntos. */
:root {
  --bg: #e3e3e3;
  --surface: #ffffff;
  --surface-2: #efe9eb;
  --line: #e3dadd;
  --fg: #1f1a1c;
  --muted: #6d6266;
  --accent: #8a1c3b;          /* guinda institucional */
  --accent-fg: #ffffff;
  --accent-soft: #f4e3e8;
  --st-seg: #a8701a;          /* en seguimiento */
  --st-pro: #2563a8;          /* en proceso */
  --st-fin: #2f7d4f;          /* finalizado */
  --st-prd: #6b4fbf;          /* producción */
  --danger: #c0392b;
  --code-bg: #1d1a1f;
  --code-fg: #ebe5e8;
  --code-kw: #f28fb0; --code-str: #a8d8a0; --code-num: #f5c27a; --code-com: #8c8389; --code-fn: #8fc3f2;
  --shadow: 0 1px 2px rgba(31, 26, 28, .05), 0 6px 18px rgba(31, 26, 28, .06);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141113; --surface: #1d191b; --surface-2: #272124; --line: #362e32; --fg: #efe8eb; --muted: #a69a9f;
    --accent: #e07795; --accent-fg: #1d0b11; --accent-soft: #3b1f29;
    --st-seg: #e2ab52; --st-pro: #74aaea; --st-fin: #62c28b; --st-prd: #a08cf0; --danger: #f07264;
    --code-bg: #0e0c0d; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141113; --surface: #1d191b; --surface-2: #272124; --line: #362e32; --fg: #efe8eb; --muted: #a69a9f;
  --accent: #e07795; --accent-fg: #1d0b11; --accent-soft: #3b1f29;
  --st-seg: #e2ab52; --st-pro: #74aaea; --st-fin: #62c28b; --st-prd: #a08cf0; --danger: #f07264;
  --code-bg: #0e0c0d; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
/* Bootstrap toma los colores de nuestros tokens */
html[data-bs-theme] {
  --bs-body-bg: var(--bg); --bs-body-color: var(--fg); --bs-emphasis-color: var(--fg);
  --bs-secondary-color: var(--muted); --bs-tertiary-bg: var(--surface-2); --bs-secondary-bg: var(--surface-2);
  --bs-border-color: var(--line); --bs-border-color-translucent: var(--line);
  --bs-body-font-family: var(--font-body); --bs-font-monospace: var(--font-mono);
  --bs-link-color: var(--accent); --bs-link-hover-color: var(--accent); --bs-link-color-rgb: 138, 28, 59;
  --bs-focus-ring-color: color-mix(in srgb, var(--accent) 30%, transparent);
  --bs-heading-color: var(--fg);
}
h1, h2, h3, h4, h5, h6, .modal-title { color: var(--fg); }
.form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
.form-control:focus, .form-select:focus, .form-check-input:focus { border-color: var(--accent); box-shadow: 0 0 0 .2rem color-mix(in srgb, var(--accent) 20%, transparent); }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ic { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.125em; flex: 0 0 auto; }
h1, h2, h3, .display { font-family: var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.min-w-0 { min-width: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Barra superior ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 14px; min-height: 58px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 9px; color: var(--fg); text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
.brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: .95rem; }
.brand b { color: var(--accent); font-weight: 800; }
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; font-size: .88rem; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .cur { color: var(--fg); font-weight: 600; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.today { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.saving-ind { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.saving-ind[hidden] { display: none; }
.spin { width: 12px; height: 12px; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex: none; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.post.saving { opacity: .72; pointer-events: none; }
/* ---------- Carga inicial ---------- */
.loader-page { padding-top: 26px; }
.loader-msg { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; color: var(--fg); }
.loader-msg small { display: block; color: var(--muted); font-size: .82rem; margin-top: 2px; }
.spin-lg { width: 30px; height: 30px; border-width: 3px; }
.skel { border-radius: 12px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 45%, var(--surface) 90%); background-size: 220% 100%; animation: shimmer 1.3s ease-in-out infinite; border: 1px solid var(--line); }
.skel-metrics { height: 92px; margin-bottom: 18px; }
.skel-row { height: 104px; margin-bottom: 12px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -120% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.ex-preview { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-size: .88rem; }
.ex-st { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; margin-left: 10px; }
.post.saving .pid::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@media (prefers-reduced-motion: reduce) { .spin, .post.saving .pid::before { animation-duration: 2s; } }
.pill-demo { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--st-seg); border: 1px solid color-mix(in srgb, var(--st-seg) 45%, transparent); border-radius: 20px; padding: 2px 8px; }
.btn-ghost { --bs-btn-color: var(--fg); --bs-btn-border-color: var(--line); --bs-btn-hover-bg: var(--surface-2); --bs-btn-hover-border-color: var(--line); --bs-btn-hover-color: var(--fg); --bs-btn-active-bg: var(--surface-2); --bs-btn-active-color: var(--fg); --bs-btn-active-border-color: var(--line); display: inline-flex; align-items: center; gap: 6px; }
.btn-accent { --bs-btn-color: var(--accent-fg); --bs-btn-bg: var(--accent); --bs-btn-border-color: var(--accent); --bs-btn-hover-color: var(--accent-fg); --bs-btn-hover-bg: color-mix(in srgb, var(--accent) 88%, black); --bs-btn-hover-border-color: transparent; --bs-btn-active-bg: var(--accent); --bs-btn-active-color: var(--accent-fg); --bs-btn-disabled-bg: var(--accent); --bs-btn-disabled-color: var(--accent-fg); display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.btn-icon { width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; border: 0; background: transparent; color: var(--muted); border-radius: 8px; }
.btn-icon:hover { background: var(--surface-2); color: var(--fg); }
.btn-icon.danger:hover { color: var(--danger); }
.modal-content, .dropdown-menu { background: var(--surface); border-color: var(--line); }
.form-control, .form-select { background-color: var(--surface); border-color: var(--line); color: var(--fg); }
.form-control::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
.dropdown-item { color: var(--fg); }
.dropdown-item:hover { background: var(--surface-2); color: var(--fg); }

/* ---------- Encabezado de cada nivel ---------- */
main { padding-block: 22px 60px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head > div { min-width: 0; }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(1.45rem, 2.6vw, 2rem); font-weight: 700; margin: 4px 0 2px; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; }
.idtag { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); background: var(--surface-2); border-radius: 5px; padding: 1px 6px; letter-spacing: 0; text-transform: none; font-weight: 500; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Métricas ---------- */
.metrics { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; margin-bottom: 20px; }
.metrics > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding-block: 2px; }
.metrics > summary::-webkit-details-marker { display: none; }
.metrics > summary .m-bar { margin-top: 0; }
.m-sum { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.m-hint { font-weight: 500; letter-spacing: 0; text-transform: none; }
.metrics .chev { transition: transform .15s; transform: rotate(-90deg); }
.metrics[open] .chev { transform: none; }
.metrics[open] > summary { margin-bottom: 12px; }
.import-box { padding: 34px 20px; }
.import-box h3 { font-size: 1.2rem; font-weight: 700; color: var(--fg); }
.import-box p { max-width: 60ch; margin: 6px auto 16px; }
code { color: var(--accent); }
.m-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 6px 18px; }
.m-tile { min-width: 0; }
.m-num { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.m-lbl { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: 0 0 auto; display: inline-block; }
.m-bar { display: flex; height: 6px; border-radius: 4px; overflow: hidden; background: var(--surface-2); margin-top: 12px; }
.m-bar span { height: 100%; }
.m-people { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .8rem; color: var(--muted); align-items: center; }
.m-people .who { display: inline-flex; align-items: center; gap: 6px; }
.m-people b { color: var(--fg); font-variant-numeric: tabular-nums; }

/* ---------- Sistemas (estilo anterior en cuadrícula) ---------- */
.area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.area-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, box-shadow .15s; min-width: 0; }
.area-tile:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: var(--shadow); }
.area-tile h2 { font-size: 1.15rem; font-weight: 700; margin: 0; }
.area-tile .desc { color: var(--muted); font-size: .86rem; margin: 0; }
.area-tile .mods { font-size: .8rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.area-tile .mods span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tile-actions { display: flex; gap: 2px; margin: -6px -6px 0 0; }
.tile-foot { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--muted); margin-top: auto; }
.tile-foot b { color: var(--fg); }
.add-tile { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); align-items: center; justify-content: center; min-height: 150px; font-weight: 600; }
.add-tile:hover { color: var(--accent); border-color: var(--accent); box-shadow: none; }

/* ---------- Módulos ---------- */
.mod-list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mod-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.mod-row:first-child { border-top: 0; }
.mod-row:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.mod-row .mid { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }
.mod-row .mname { font-family: var(--font-display); font-weight: 600; font-size: 1rem; min-width: 0; }
.mod-row .msub { font-size: .78rem; color: var(--muted); font-family: var(--font-body); font-weight: 400; }
.st-counts { display: flex; gap: 12px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.st-counts span { display: inline-flex; align-items: center; gap: 5px; }
.row-actions { display: flex; gap: 0; }
@media (max-width: 760px) {
  .mod-row { grid-template-columns: 44px minmax(0, 1fr) auto; }
  .mod-row .st-counts { grid-column: 2 / -1; grid-row: 2; }
}

/* ---------- Filtros ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.toolbar .form-select, .toolbar .form-control { width: auto; font-size: .86rem; }
.toolbar .search { position: relative; flex: 1 1 220px; max-width: 320px; }
.toolbar .search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.toolbar .search input { padding-left: 32px; width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; font-size: .84rem; display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.active-filters { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 14px; }
.fchip { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 20px; padding: 2px 6px 2px 10px; }

/* ---------- Tablero de cards ---------- */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 1180px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) { .board { grid-template-columns: minmax(0, 1fr); } }
/* ---------- Tablero general (todas las cards) ---------- */
.post-path { display: flex; align-items: center; gap: 4px; font-size: .72rem; color: var(--muted); margin: 2px 0 4px; min-width: 0; }
.post-path span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post-path svg { width: 11px; height: 11px; flex: none; }
.post-path .go-mod { margin-left: auto; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; width: 22px; height: 22px; display: inline-grid; place-items: center; padding: 0; }
.post-path .go-mod:hover, .post-path .go-mod:focus-visible { color: var(--accent); border-color: var(--accent); }
.post-path .go-mod svg { width: 13px; height: 13px; }
.btn-assign { border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 20px; padding: 1px 8px; font-size: .74rem; display: inline-flex; align-items: center; gap: 4px; }
.btn-assign:hover { border-color: var(--accent); color: var(--accent); }
.btn-assign svg { width: 12px; height: 12px; }
.col-more { display: block; text-align: center; font-size: .8rem; padding: 8px 4px 2px; color: var(--muted); }
.col-more a { color: var(--accent); }
.tb-hint { font-size: .78rem; color: var(--muted); padding: 0 4px 8px; }
.col { background: color-mix(in srgb, var(--surface-2) 60%, var(--bg)); border-radius: 12px; padding: 10px; min-width: 0; }
.col.drop { outline: 2px dashed var(--c); outline-offset: -3px; }
.col-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 10px; }
.col-head h2 { font-size: .95rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
.col-head .count { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); font-weight: 500; }
.col-body { display: flex; flex-direction: column; gap: 10px; }
.empty { text-align: center; color: var(--muted); font-size: .85rem; padding: 22px 10px; border: 1.5px dashed var(--line); border-radius: 10px; }

.post { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 9px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.post:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow); }
.post[draggable="true"] { cursor: grab; }
.post.dragging { opacity: .45; }
.post-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .74rem; color: var(--muted); }
.post-top .pid { font-family: var(--font-mono); }
.post h3 { font-size: 1.02rem; font-weight: 650; margin: 0; line-height: 1.3; word-break: break-word; }
.byline { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); }
.byline b { color: var(--fg); font-weight: 600; }
.excerpt { font-size: .88rem; color: color-mix(in srgb, var(--fg) 85%, var(--muted)); white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
.code-peek { position: relative; max-height: 98px; overflow: hidden; border-radius: 8px; background: var(--code-bg); }
.code-peek::after { content: ""; position: absolute; inset: auto 0 0; height: 30px; background: linear-gradient(transparent, var(--code-bg)); }
.code-peek pre { margin: 0; padding: 9px 11px; font-size: .74rem; }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip-file { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; font-size: .78rem; border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; background: var(--surface); color: var(--fg); }
.fchip-file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fchip-file .sz { color: var(--muted); font-family: var(--font-mono); font-size: .7rem; }
.thumbs { display: flex; gap: 6px; }
.thumbs img { width: 64px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { border: 0; background: var(--accent-soft); color: var(--accent); font-size: .74rem; font-weight: 600; border-radius: 5px; padding: 1px 7px; font-family: var(--font-mono); }
.tag:hover { filter: brightness(.96); }
.post-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .76rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 9px; }
.post-foot .meta { display: flex; gap: 10px; align-items: center; }
.post-foot .meta span { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.kinds { display: inline-flex; gap: 6px; }
.prog { width: 46px; height: 4px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: inline-block; }
.prog i { display: block; height: 100%; background: var(--st-fin); }

/* Prioridad y estado */
.prio { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 600; border-radius: 5px; padding: 1px 7px; color: var(--pc); background: color-mix(in srgb, var(--pc) 12%, transparent); }
.prio-Baja { --pc: var(--muted); } .prio-Media { --pc: var(--st-pro); } .prio-Alta { --pc: var(--st-seg); } .prio-Crítica { --pc: var(--danger); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 600; color: var(--c); }
.c-seguimiento { --c: var(--st-seg); } .c-proceso { --c: var(--st-pro); } .c-finalizado { --c: var(--st-fin); } .c-produccion { --c: var(--st-prd); }

/* Vista blog */
.feed { display: flex; flex-direction: column; gap: 14px; max-width: 860px; }
.feed .post { padding: 18px 20px; gap: 11px; }
.feed .post h3 { font-size: 1.22rem; }
.feed .excerpt { -webkit-line-clamp: 6; font-size: .93rem; }
.feed .code-peek { max-height: 170px; }

/* Avatares */
.av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--avc); color: #fff; font-weight: 700; font-size: .62rem; width: 22px; height: 22px; flex: 0 0 auto; border: 2px solid var(--surface); font-family: var(--font-body); }
.av-lg { width: 30px; height: 30px; font-size: .72rem; }
.avs { display: inline-flex; }
.avs .av + .av { margin-left: -7px; }

/* ---------- Detalle (modal) ---------- */
.d-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .84rem; color: var(--muted); align-items: center; }
.d-section { margin-top: 22px; }
.d-section > h4 { font-family: var(--font-display); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.blk + .blk { margin-top: 14px; }
.blk-text { white-space: pre-wrap; word-break: break-word; font-size: .95rem; line-height: 1.6; max-width: 72ch; }
.code-box { border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 6px 12px; font-size: .74rem; color: var(--code-fg); background: color-mix(in srgb, var(--code-bg) 85%, white); font-family: var(--font-mono); }
.code-bar button { border: 0; background: transparent; color: var(--code-fg); font-size: .74rem; display: inline-flex; gap: 5px; align-items: center; }
.code-box pre { margin: 0; padding: 12px 14px; overflow-x: auto; max-height: 460px; }
pre code, .code-peek code { font-family: var(--font-mono); color: var(--code-fg); font-size: .8rem; background: transparent; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-type { color: var(--code-kw); }
.hljs-string, .hljs-attr, .hljs-template-variable { color: var(--code-str); }
.hljs-number, .hljs-literal { color: var(--code-num); }
.hljs-comment, .hljs-quote { color: var(--code-com); font-style: italic; }
.hljs-title, .hljs-function, .hljs-name { color: var(--code-fn); }
.d-img { max-width: 100%; max-height: 340px; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
.chk { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.chk:last-child { border-bottom: 0; }
.chk.done label { text-decoration: line-through; color: var(--muted); }
.chk label { flex: 1; min-width: 0; word-break: break-word; }
.chk .btn-icon { opacity: 0; }
.chk:hover .btn-icon, .com:hover .btn-icon { opacity: 1; }
.com { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.com:last-child { border-bottom: 0; }
.com .body { flex: 1; min-width: 0; }
.com .who { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.com .who b { color: var(--fg); }
.com .txt { white-space: pre-wrap; word-break: break-word; font-size: .9rem; }
.com .btn-icon { opacity: 0; width: 26px; height: 26px; }
.state-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.state-switch button { border: 0; background: transparent; color: var(--muted); padding: 5px 11px; font-size: .82rem; display: inline-flex; align-items: center; gap: 6px; }
.state-switch button.on { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); font-weight: 600; }
.state-switch button:disabled { cursor: default; }

/* ---------- Editor ---------- */
.ed-block { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.ed-block + .ed-block { margin-top: 10px; }
.ed-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); font-size: .8rem; font-weight: 600; color: var(--muted); }
.ed-head .grow { flex: 1; }
.ed-body { padding: 10px; }
.ed-body textarea { font-size: .9rem; }
.ed-body textarea.code { font-family: var(--font-mono); font-size: .82rem; background: var(--code-bg); color: var(--code-fg); border-color: transparent; tab-size: 2; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 20px; padding: 3px 11px 3px 4px; font-size: .84rem; }
.pick button.on { border-color: var(--accent); background: var(--accent-soft); }
.pick button small { color: var(--muted); }
.tag-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--surface); }
.tag-input input { border: 0; outline: 0; flex: 1; min-width: 120px; background: transparent; color: var(--fg); font-size: .88rem; }
.tag-input .tag { display: inline-flex; gap: 4px; align-items: center; }

/* ---------- Navegación superior ---------- */
.topnav { display: flex; gap: 2px; }
.topnav a { color: var(--muted); text-decoration: none; font-size: .88rem; font-weight: 600; padding: 5px 10px; border-radius: 7px; }
.topnav a:hover { color: var(--fg); background: var(--surface-2); }
.topnav a.on { color: var(--accent); background: var(--accent-soft); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; text-align: left; }
.linkish:hover { text-decoration: underline; }

/* ---------- Sistemas en forma de blog ---------- */
.area-feed { display: flex; flex-direction: column; gap: 12px; }
.area-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 250px; gap: 18px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.area-row:not(:has(.grip)) { grid-template-columns: minmax(0, 1fr) 250px; }
.area-row:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: var(--shadow); }
.area-row h2 { font-size: 1.3rem; font-weight: 700; margin: 4px 0; }
.area-row .desc { color: var(--muted); margin: 0 0 10px; max-width: 70ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.area-side { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.area-side .m-bar { margin-top: 0; }
.area-side .row-actions { justify-content: flex-end; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: .74rem; font-weight: 500; border-radius: 6px; padding: 2px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.mchip:hover { border-color: var(--accent); color: var(--accent); }
.mchip.more { background: transparent; color: var(--muted); }
.recent { margin-top: 10px; font-size: .82rem; color: var(--muted); display: flex; gap: 6px; align-items: center; min-width: 0; }
.recent .linkish { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
@media (max-width: 760px) { .area-row, .area-row:not(:has(.grip)) { grid-template-columns: minmax(0, 1fr); } .area-row .grip { display: none; } }

/* Ordenar arrastrando (sistemas y módulos) */
.grip { color: var(--muted); cursor: grab; display: inline-grid; place-items: center; width: 22px; height: 28px; border-radius: 6px; }
.grip:hover { background: var(--surface-2); color: var(--fg); }
.grip .ic { stroke-width: 3.2; }
[data-sort].dragging { opacity: .45; }
[data-sort].drop-before { box-shadow: inset 0 3px 0 var(--accent); }
[data-sort].drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
.area-row.drop-before { box-shadow: 0 -3px 0 var(--accent); }
.area-row.drop-after { box-shadow: 0 3px 0 var(--accent); }
.mod-row .mid { display: inline-flex; align-items: center; gap: 4px; }
.mod-row.sortable { grid-template-columns: 82px minmax(0, 1fr) auto auto; }
.hint { font-size: .8rem; color: var(--muted); margin: -8px 0 10px; display: flex; align-items: center; gap: 6px; }
@media (max-width: 760px) { .mod-row.sortable { grid-template-columns: 70px minmax(0, 1fr) auto; } }

/* Tamaño máximo de columnas y cards */
.col-body { max-height: calc(100vh - 230px); min-height: 80px; overflow-y: auto; padding-right: 2px; }
@media (max-width: 980px) { .col-body { max-height: 70vh; } }
.post-body { display: flex; flex-direction: column; gap: 9px; max-height: var(--max, 300px); overflow: hidden; position: relative; }
.post.clipped .post-body::after { content: ""; position: absolute; inset: auto 0 0; height: 36px; background: linear-gradient(transparent, var(--surface)); pointer-events: none; }
.see-all { font-size: .76rem; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 4px; }
.tag.more { background: transparent; color: var(--muted); }

/* ---------- Histórico ---------- */
.hist-search { position: relative; max-width: 720px; margin-bottom: 22px; display: flex; align-items: center; }
.hist-search > .ic { position: absolute; left: 13px; color: var(--muted); }
.hist-search input { padding: 10px 40px 10px 38px; font-size: .95rem; }
.hist-search .btn-icon { position: absolute; right: 4px; }
.hist { display: flex; flex-direction: column; gap: 24px; max-width: 920px; }
.hist-day h2 { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.hist-item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.hist-item + .hist-item { margin-top: 8px; }
.hist-item:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.hist-time { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.hist-body { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.hist-body h3 { font-size: 1rem; font-weight: 650; margin: 0; }
.hist-body .pid { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); font-weight: 500; }
.hist-path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .76rem; color: var(--muted); }
.hist-path .linkish { color: var(--muted); }
.hist-path .linkish:hover { color: var(--accent); }
.hist-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: .78rem; color: var(--muted); }
.hist-meta > span { display: inline-flex; align-items: center; gap: 5px; }
@media (max-width: 560px) { .hist-item { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Campanita ---------- */
.bell { position: relative; }
.bell-badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: .66rem; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--surface); }
.notif-menu { width: min(360px, calc(100vw - 32px)); padding: 0; overflow: hidden; }
.notif-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.notif-list { max-height: 420px; overflow-y: auto; }
.notif { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); padding: 10px 14px; font-size: .84rem; }
.notif:last-child { border-bottom: 0; }
.notif:hover { background: var(--surface-2); }
.notif.unread { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.notif .ntext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; word-break: break-word; }
.notif .nsub { display: block; color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notif .nwhen { color: var(--muted); font-size: .74rem; }
.notif .dot { margin-top: 6px; }
.notif-empty { padding: 18px 14px; color: var(--muted); font-size: .84rem; }

/* ---------- Recientes (pantalla de Sistemas) ---------- */


/* ---------- Avisos, confirmación y visor ---------- */
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 3000; display: flex; flex-direction: column; gap: 8px; }
.toast-x { background: var(--fg); color: var(--bg); border-radius: 9px; padding: 9px 14px; font-size: .86rem; box-shadow: var(--shadow); max-width: 340px; }
.toast-x.err { background: var(--danger); color: #fff; }
.overlay { position: fixed; inset: 0; z-index: 2500; background: rgba(15, 10, 12, .55); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.overlay-box { background: var(--surface); color: var(--fg); border-radius: 14px; padding: 20px; max-width: 440px; width: 100%; box-shadow: var(--shadow); }
.overlay-box.wide { max-width: 980px; max-height: 90vh; overflow: auto; }
.overlay-box h3 { font-size: 1.1rem; font-weight: 700; margin: 0 0 6px; }
.overlay-box p { color: var(--muted); margin: 0 0 16px; }
.banner { display: flex; gap: 10px; align-items: center; font-size: .84rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 16px; }
.banner b { color: var(--fg); }
</style>

}

/* ----------------------- Capa de datos (Modelo) -----------------------
 * Misma interfaz para demo (navegador) y para Google Sheets:
 *   load() → { areas, modulos, cards, bloques, checklist, comentarios }
 *   save(coleccion, objeto)   crea si no trae id, actualiza si trae id

/** Indicador "Guardando…" del encabezado y cards que se están guardando */
const Saving = {
  n: 0, cards: new Set(),
  begin() { this.n++; this.show(); }, end() { this.n = Math.max(0, this.n - 1); this.show(); },
  show() { const el = document.getElementById('savingInd'); if (el) el.hidden = !(this.n || this.cards.size); }
};
const LocalRepo = {
  data: null, warned: false,
  async load() {
    let d = null;
    try { d = JSON.parse(LS.get(CONFIG.STORE_KEY)); } catch { d = null; }
    if (!d || !Array.isArray(d.sistemas)) d = seed();
    else if (d.origen === 'tablero') {        // el Tablero de accesos creó el catálogo en este navegador
      const ej = seed(), ids = new Set(d.modulos.map(m => m.id));
      ej.sistemas = d.sistemas; ej.modulos = d.modulos;
      ej.cards = ej.cards.filter(c => ids.has(c.id_modulo));
      const keep = new Set(ej.cards.map(c => c.id));
      ['bloques', 'checklist', 'comentarios', 'notificaciones'].forEach(k => { ej[k] = ej[k].filter(x => keep.has(x.id_card)); });
      d = ej;
    }
    ['sistemas', 'modulos', 'cards', 'bloques', 'checklist', 'comentarios'].forEach(k => { d[k] ||= []; });
    if (!Array.isArray(d.notificaciones)) d.notificaciones = seedNotifs(d);   // datos de una versión anterior
    this.data = d; this.persist();
    return d;
  },
  persist() {
    if (!LS.set(CONFIG.STORE_KEY, JSON.stringify(this.data)) && !this.warned) {
      this.warned = true;
      toast('Este navegador no permite guardar: los cambios se perderán al recargar.', true);
    }
  },
  nextId(col) { return this.data[col].reduce((m, x) => Math.max(m, Number(x.id) || 0), 0) + 1; },
  async save(col, obj) {
    const list = this.data[col];
    if (!obj.id) { obj = { ...obj, id: this.nextId(col) }; list.push(obj); }
    else { const i = list.findIndex(x => String(x.id) === String(obj.id)); if (i < 0) list.push(obj); else list[i] = obj = { ...list[i], ...obj }; }
    this.persist();
    return obj;
  },
  async remove(col, ids) {
    const set = new Set([].concat(ids).map(String));
    this.data[col] = this.data[col].filter(x => !set.has(String(x.id)));
    this.persist();
  },
  async importCatalog(cat) {
    if (this.data.sistemas.length || this.data.modulos.length) throw new Error('Ya hay datos: la importación solo se permite con la hoja vacía.');
    this.data.sistemas = cat.sistemas.map(x => ({ descripcion: '', ...x, id: Number(x.id), orden: Number(x.orden) || 0, estatus: Number(x.estatus ?? 1) }));
    this.data.modulos = cat.subsistemas.map(x => ({ ...x, id: Number(x.id), id_sistema: Number(x.id_sistema), orden: Number(x.orden) || 0, estatus: Number(x.estatus ?? 1) }));
    this.persist();
    return { sistemas: this.data.sistemas.length, modulos: this.data.modulos.length };
  }
};
/* Adaptador para Google Sheets (Apps Script). Se activa al poner CONFIG.API_URL.
   Acciones esperadas en el Web App: all, save, remove  (body: {action, entity, data, key, user}) */
const RemoteRepo = {
  data: null,
  async call(action, payload = {}) {
    const write = action !== 'all';
    if (write) Saving.begin();
    try {
      const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action, key: CONFIG.API_KEY, user: Auth.me(), ...payload }) });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'Error del servidor');
      return j.data;
    } finally { if (write) Saving.end(); }
  },
  async load() {
    this.data = await this.call('all');
    ['sistemas', 'modulos', 'cards', 'bloques', 'checklist', 'comentarios', 'notificaciones'].forEach(k => { this.data[k] ||= []; });
    return this.data;
  },
  async save(col, obj) {
    const saved = await this.call('save', { entity: col, data: obj });
    const list = this.data[col], i = list.findIndex(x => String(x.id) === String(saved.id));
    if (i < 0) list.push(saved); else list[i] = saved;
    return saved;
  },
  async importCatalog(cat) {
    const r = await this.call('import', { data: { sistemas: cat.sistemas, subsistemas: cat.subsistemas } });
    await this.load();
    return r;
  },
  async remove(col, ids) {
    if (![].concat(ids).length) return;
    await this.call('remove', { entity: col, data: { ids: [].concat(ids) } });
    const set = new Set([].concat(ids).map(String));
    this.data[col] = this.data[col].filter(x => !set.has(String(x.id)));
  }
};

  modulo: id => D().modulos.find(m => String(m.id) === String(id)),

  card: id => D().cards.find(c => String(c.id) === String(id)),
  bloques: idCard => D().bloques.filter(b => String(b.id_card) === String(idCard)).sort(byOrden),
  checks: idCard => D().checklist.filter(c => String(c.id_card) === String(idCard)).sort((a, b) => a.id - b.id),
  comments: idCard => D().comentarios.filter(c => String(c.id_card) === String(idCard)).sort((a, b) => String(a.fecha_alta).localeCompare(String(b.fecha_alta))),
  done: c => c.hecho === true || c.hecho === 'TRUE' || c.hecho === 'true' || c.hecho === 1,
  /** Hashtags de la card: los capturados + los #tags escritos en los textos */
  tags(card) {
    const set = new Set(splitList(card.hashtags).map(normTag));
    Q.bloques(card.id).filter(b => b.tipo === 'texto').forEach(b => { for (const m of String(b.contenido).matchAll(TAG_RE)) set.add(normTag(m[1])); });
    set.delete('');
    return [...set];
  },
  kinds(card) {
    const k = new Set(Q.bloques(card.id).map(b => b.tipo));
    if (Q.bloques(card.id).some(b => b.tipo === 'archivo' && /^image\//.test(b.mime || ''))) k.add('imagen');
    return k;
  }
};

/** Notificaciones de ejemplo: una por cada asignación (las de menos de 3 días quedan sin leer) */
function seedNotifs(d) {
  const out = []; let id = 0;
  d.cards.forEach(c => splitList(c.asignados).forEach(u => {
    if (u === c.autor) return;
    const recent = (Date.now() - parseDate(c.fecha_alta)) < 3 * 864e5;
    out.push({ id: ++id, para: u, tipo: 'asignacion', id_card: c.id, de: c.autor, texto: '', fecha_alta: c.fecha_alta, leida: !recent });
  }));
  d.comentarios.forEach(k => {
    const c = d.cards.find(x => x.id === k.id_card); if (!c) return;
    [...new Set([...splitList(c.asignados), c.autor])].filter(u => u !== k.autor).forEach(u =>
      out.push({ id: ++id, para: u, tipo: 'comentario', id_card: c.id, de: k.autor, texto: k.texto, fecha_alta: k.fecha_alta, leida: (Date.now() - parseDate(k.fecha_alta)) > 864e5 }));
  });
  return out;
}

/** Devuelve el foco a donde estaba (o al modal abierto) para que Esc siga funcionando */
const restoreFocus = prev => { if (prev && prev.isConnected && prev.focus) prev.focus(); else $('.modal.show')?.focus(); };
/** Si hay un modal abierto, el overlay va dentro de él para conservar el foco */
const overlayHost = () => $('.modal.show') || document.body;
/** Confirmación dentro de la página (el visor no permite confirm()) */
function ask(title, text, okLabel = 'Eliminar') {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="overlay-box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="d-flex justify-content-end gap-2"><button class="btn btn-ghost" data-r="0">Cancelar</button><button class="btn btn-danger" data-r="1">${esc(okLabel)}</button></div></div>`;
    const prev = document.activeElement;
    const done = v => { ov.remove(); document.removeEventListener('keydown', onKey, true); restoreFocus(prev); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    ov.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); else if (e.target === ov) done(false); });
    document.addEventListener('keydown', onKey, true);
    overlayHost().appendChild(ov);
    ov.querySelector('[data-r="1"]').focus();
  });
}
/** Visor de archivos: imagen, texto o datos del archivo */
function viewFile(b) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  let body;
  const inDrive = !!b.fileId;
  if (/^image\//.test(b.mime) && b.url) body = `<img src="${esc(fileSrc(b))}" alt="${esc(b.fileName)}" style="max-width:100%;border-radius:10px" referrerpolicy="no-referrer">`;
  else if (inDrive) body = `<p>El archivo está guardado en Google Drive.</p><a class="btn btn-accent" href="${esc(fileLink(b))}" target="_blank" rel="noopener">Abrir en Drive</a>`;
  else if (b.url && (/^text\/|json|csv|xml/.test(b.mime))) {
    let t = ''; try { t = decodeURIComponent(b.url.split(',').slice(1).join(',')); if (/;base64,/.test(b.url)) t = atob(b.url.split(',')[1]); } catch { t = '(no se pudo leer el archivo)'; }
    body = `<div class="code-box"><pre><code class="language-plaintext">${esc(t)}</code></pre></div>`;
  } else body = `<p>${b.url ? 'Vista previa no disponible para este tipo de archivo.' : 'En el demo solo se guardó el nombre del archivo. Con Google Sheets se sube a Drive.'}</p>`;
  ov.innerHTML = `<div class="overlay-box wide" role="dialog" aria-modal="true">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3"><h3 class="m-0 text-truncate">${icon('file')} ${esc(b.fileName)}</h3>
      <div class="d-flex gap-2 align-items-center"><span class="small text-body-secondary">${esc(fmtSize(b.size))}</span>
      ${b.url && CAN_DOWNLOAD && !inDrive ? `<a class="btn btn-sm btn-ghost" href="${esc(b.url)}" download="${esc(b.fileName)}">Descargar</a>` : ''}${inDrive ? `<a class="btn btn-sm btn-ghost" href="${esc(fileLink(b))}" target="_blank" rel="noopener">Drive</a>` : ''}
      <button class="btn-icon" data-close aria-label="Cerrar">${icon('x')}</button></div></div>${body}</div>`;
  const prev = document.activeElement;
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey, true); restoreFocus(prev); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey, true);
  overlayHost().appendChild(ov);
  highlight(ov);
}

function stats(cards) {

function metricsHtml(cards, { extra = [], people = false, key = 'inicio' } = {}) {

/** Cambia el estado al instante en pantalla y guarda en segundo plano (se revierte si falla) */
async function moveCard(c, estado, after) {
  if (!c || c.estado === estado) return;
  const prev = { estado: c.estado, actualizado: c.actualizado, fecha_estado: c.fecha_estado }, key = String(c.id);
  c.estado = estado; c.actualizado = stamp(); c.fecha_estado = c.actualizado;
  Saving.cards.add(key); Saving.show(); render(); after?.();
  try {
    await Repo.save('cards', { id: c.id, estado, actualizado: c.actualizado, fecha_estado: c.fecha_estado });
    toast(`#${c.id} → ${ST[estado].label}`);
    Notif.send(Notif.watchers(c), 'estado', c, 'a ' + ST[estado].label).catch(() => {});
  } catch (err) {
    const cur = Q.card(c.id) || c; Object.assign(cur, prev);
    toast('No se pudo mover la card: ' + err.message, true);
  } finally { Saving.cards.delete(key); Saving.show(); render(); after?.(); }
}

  const dayKey = s => String(s).slice(0, 10);
  const dayLabel = k => {
    const t = stamp().slice(0, 10), y = stamp(new Date(Date.now() - 864e5)).slice(0, 10);
    if (k === t) return 'Hoy';
    if (k === y) return 'Ayer';
    const d = parseDate(k + ' 12:00:00');
    return isNaN(d) ? k : d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).replace(/^./, x => x.toUpperCase());
  };
  const groups = [];
  list.forEach(c => { const k = dayKey(c.fecha_alta); const g = groups.at(-1); if (g && g.k === k) g.items.push(c); else groups.push({ k, items: [c] }); });
  const item = histItem;
  return `<div class="page-head"><div><div class="eyebrow">Todos los sistemas</div><h1>Histórico</h1><p class="lede">${esc(note)}</p></div>
      <div class="head-actions"><button class="btn btn-ghost" data-act="informe" title="Informe por integrante, con título, descripción y estatus">${icon('download')} Exportar informe (Excel)</button></div></div>
    <div class="hist-search">${icon('search')}<input class="form-control" id="hQ" value="${esc(State.hq)}" placeholder="Buscar en todos los sistemas: título, texto, código, archivo, #hashtag, persona o #ID" aria-label="Buscar en todos los sistemas">${State.hq ? `<button class="btn-icon" data-act="hq-clear" title="Limpiar búsqueda">${icon('x')}</button>` : ''}</div>
    ${groups.length ? `<div class="hist">${groups.map(g => `<section class="hist-day"><h2>${esc(dayLabel(g.k))}</h2>${g.items.map(item).join('')}</section>`).join('')}</div>`
      : `<div class="empty">${q ? `No hay cards que coincidan con «${esc(State.hq)}».` : 'Todavía no hay cards.'}</div>`}`;
}

/* ------------------------------ Modal principal ------------------------------ */
const Modal = {
  el: null, bs: null, onHide: null,
  open(title, body, foot = '', size = 'lg') {
    this.el ||= $('#mMain');
    this.bs ||= bootstrap.Modal.getOrCreateInstance(this.el);
    const wasOpen = this.el.classList.contains('show');
    this.el.onpaste = null;
    this.el.querySelector('.modal-dialog').className = `modal-dialog modal-dialog-scrollable modal-${size}`;
    $('#mTitle').innerHTML = title; $('#mBody').innerHTML = body; $('#mFoot').innerHTML = foot;
    $('#mFoot').hidden = !foot;

function formModulo(m, idSistema) {
  const isNew = !m;
  m ||= { nombre: '', archivo_subsistema: '', id_sistema: idSistema };
  const nCards = isNew ? 0 : Q.cards(m.id).length;
  const el = Modal.open(isNew ? 'Nuevo módulo' : `Editar módulo <span class="idtag">ID ${esc(m.id)}</span>`,
    `<form id="fMod"><label class="form-label small" for="fmNombre">Nombre del módulo</label><input class="form-control mb-3" id="fmNombre" maxlength="100" required value="${esc(m.nombre)}" placeholder="Ej. ALTA DE PROMOCIONES">

     <label class="form-label small" for="fmArea">Sistema</label><select class="form-select" id="fmArea">${Q.areas().map(a => `<option value="${a.id}" ${String(a.id) === String(m.id_sistema) ? 'selected' : ''}>${esc(a.nombre)}</option>`).join('')}</select>
     ${isNew ? '<div class="form-text">El ID se asigna automáticamente.</div>' : `<div class="form-text">Si eliges otro sistema, el módulo se mueve con sus ${nCards} card(s), su contenido, checklist y comentarios.</div>`}</form>`,
    `<button class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-accent" id="fmSave">${isNew ? 'Crear módulo' : 'Guardar'}</button>`, 'md');
  const save = async () => {
    const nombre = $('#fmNombre', el).value.trim();
    if (!nombre) return $('#fmNombre', el).focus();
    const id_sistema = Number($('#fmArea', el).value);
    const moved = !isNew && String(m.id_sistema) !== String(id_sistema);
    if (moved) {
      const from = Q.area(m.id_sistema), to = Q.area(id_sistema);
      const ok = await ask(`Mover «${nombre}» a ${to?.nombre || 'otro sistema'}`,
        `Sale de ${from?.nombre || 'su sistema actual'} y se lleva sus ${nCards} card(s) con todo su contenido, checklist y comentarios.`, 'Mover módulo');
      if (!ok) return;
    }
    const obj = { ...m, nombre, archivo_subsistema: $('#fmArchivo', el).value.trim(), id_sistema };
    if (isNew || moved) obj.orden = Q.modulos(id_sistema).length + 1;
    if (isNew) Object.assign(obj, { estatus: 1, fecha_alta: stamp() });
    const saved = await Repo.save('modulos', obj);
    // El sistema de origen conserva un orden consecutivo
    if (moved) await saveOrder('modulos', Q.modulos(m.id_sistema).map(x => x.id));
    Modal.close();
    toast(isNew ? `Módulo «${nombre}» creado` : moved ? `Módulo movido a ${Q.area(id_sistema)?.nombre} con sus ${nCards} card(s)` : 'Módulo actualizado');
    if (isNew) go('modulo-' + saved.id); else if (moved && State.route.view === 'area') go('sistema-' + id_sistema); else render();
  };
  $('#fmSave', el).onclick = () => save().catch(err => toast(err.message, true));
  $('#fMod', el).onsubmit = e => { e.preventDefault(); save().catch(err => toast(err.message, true)); };
  setTimeout(() => $('#fmNombre', el).focus(), 300);
}

/* ------------------------- Importar catálogo de sistemas -------------------------
 * Solo se permite cuando no hay sistemas ni módulos (hoja vacía) y siempre pide confirmación. */
const canImport = () => !D().sistemas.length && !D().modulos.length;
function emptySistemas(logged) {
  if (!canImport()) return `<div class="empty">Aún no hay sistemas.${logged ? ' Usa «Nuevo sistema» para crear el primero.' : ''}</div>`;
  const cat = window.CATALOGO_SISTEMAS;
  return `<div class="empty import-box">

    <p>La hoja está vacía. Puedes importar los sistemas y módulos de <code>catalogo_sistemas.js</code>${cat ? ` (${cat.sistemas.length} sistemas y ${cat.subsistemas.length} módulos)` : ''} o crearlos uno por uno.</p>
    ${logged ? `<div class="d-flex gap-2 justify-content-center flex-wrap">
      ${cat ? `<button class="btn btn-accent" data-act="cat-import">${icon('layers')} Importar catálogo</button>` : ''}
      <button class="btn btn-ghost" data-act="cat-file">${icon('file')} Elegir archivo de catálogo…</button>
      <button class="btn btn-ghost" data-act="area-new">${icon('plus')} Nuevo sistema</button></div>
      <input type="file" id="catFile" accept=".js,.json,application/json,text/javascript" hidden>` : '<p class="mb-0">Inicia sesión para importar.</p>'}
  </div>`;
}
/** Lee un catálogo en .js (window.CATALOGO_SISTEMAS = {...}) o .json */
function parseCatalog(text) {
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('El archivo no contiene un catálogo.');
  const c = JSON.parse(text.slice(a, b + 1));
  if (!Array.isArray(c.sistemas) || !Array.isArray(c.subsistemas)) throw new Error('El catálogo debe traer "sistemas" y "subsistemas".');
  return c;
}
async function importCatalog(cat) {
  if (!canImport()) return toast('Ya hay sistemas registrados: la importación solo se permite con la hoja vacía.', true);
  const ids = new Set(cat.sistemas.map(x => Number(x.id)));
  const huerfanos = cat.subsistemas.filter(m => !ids.has(Number(m.id_sistema))).length;
  const ok = await ask('Importar catálogo',
    `Se crearán ${cat.sistemas.length} sistemas y ${cat.subsistemas.length} módulos con sus IDs originales.${huerfanos ? ` ${huerfanos} módulo(s) apuntan a un sistema que no existe.` : ''} Solo se puede hacer una vez, con la hoja vacía.`, 'Importar');
  if (!ok) return;
  try {
    const r = await Repo.importCatalog(cat);
    toast(`Importados ${r.sistemas} sistemas y ${r.modulos} módulos`);
    render();
  } catch (err) { toast(err.message, true); }
}

/* Borrados en cascada */
async function deleteCards(ids) {
  ids = [].concat(ids).map(String);
  const sub = col => D()[col].filter(x => ids.includes(String(x.id_card))).map(x => x.id);
  await Repo.remove('bloques', sub('bloques'));
  await Repo.remove('checklist', sub('checklist'));
  await Repo.remove('comentarios', sub('comentarios'));
  await Repo.remove('notificaciones', sub('notificaciones'));
  await Repo.remove('cards', ids);
}
async function deleteModulo(m) {
  const n = Q.cards(m.id).length;
  if (!await ask(`Eliminar «${m.nombre}»`, n ? `También se eliminarán sus ${n} card(s) con su contenido, checklist y comentarios.` : 'El módulo no tiene cards.')) return;
  await deleteCards(Q.cards(m.id).map(c => c.id));
  await Repo.remove('modulos', m.id);
  toast('Módulo eliminado');
  if (State.route.view === 'modulo') go('sistema-' + m.id_sistema); else render();
}
async function deleteArea(a) {
  const mods = Q.modulos(a.id), n = Q.cardsArea(a.id).length;
  if (!await ask(`Eliminar el sistema «${a.nombre}»`, `Se eliminarán ${mods.length} módulo(s) y ${n} card(s).`)) return;
  await deleteCards(Q.cardsArea(a.id).map(c => c.id));
  await Repo.remove('modulos', mods.map(m => m.id));
  await Repo.remove('sistemas', a.id);
  if (Repo === LocalRepo) {   // en Google Sheets esto lo hace el servidor
    try { const k = 'tablero-accesos-v4:local', t = JSON.parse(localStorage.getItem(k)); if (t && Array.isArray(t.permisos)) { t.permisos = t.permisos.filter(x => x.m !== Number(a.id)); localStorage.setItem(k, JSON.stringify(t)); } } catch { /* sin almacenamiento */ }
  }
  toast('Sistema eliminado');
  go('');
}
/** Guarda el nuevo orden (1, 2, 3…) de una lista de ids */
async function saveOrder(col, ids) {
  const list = D()[col];
  for (let k = 0; k < ids.length; k++) {
    const it = list.find(x => String(x.id) === String(ids[k]));
    if (it && Number(it.orden) !== k + 1) await Repo.save(col, { id: it.id, orden: k + 1 });
  }
}
async function moveModulo(m, dir) {
  const ids = Q.modulos(m.id_sistema).map(x => x.id), i = ids.indexOf(m.id), j = i + dir;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  await saveOrder('modulos', ids); render();
}
async function moveArea(a, dir) {
  const ids = Q.areas().map(x => x.id), i = ids.indexOf(a.id), j = i + dir;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  await saveOrder('sistemas', ids); render();
}

    <div class="d-section"><h4>${icon('chat')} Comentarios <span class="idtag">${coms.length}</span></h4>
      ${coms.map(k => `<div class="com">${avatar(k.autor, true)}<div class="body"><div class="who"><span><b>${esc(userOf(k.autor).name)}</b> · ${ago(k.fecha_alta)}</span>${logged && (k.autor === Auth.me() || Auth.isAdmin()) ? `<button class="btn-icon danger" data-com-del="${k.id}" title="Eliminar comentario">${icon('trash')}</button>` : ''}</div><div class="txt">${richText(k.texto)}</div></div></div>`).join('') || '<div class="text-body-secondary small">Sin comentarios.</div>'}
      ${logged ? `<form id="comForm" class="mt-2"><textarea class="form-control form-control-sm" id="comNew" rows="2" placeholder="Escribe un comentario (Ctrl+Enter para enviar)"></textarea><div class="text-end mt-2"><button class="btn btn-sm btn-accent">Comentar</button></div></form>` : ''}
    </div>`;
  const foot = logged ? `${canDelete(c) ? `<button class="btn btn-ghost text-danger me-auto" data-card-del>${icon('trash')} Eliminar</button>` : ''}<button class="btn btn-accent" data-card-edit>${icon('edit')} Editar card</button>` : '';
  const el = Modal.open(`<span class="idtag me-2">#${esc(c.id)}</span>${esc(c.titulo)}<div class="small text-body-secondary fw-normal mt-1" style="font-family:var(--font-body)">${esc(m?.nombre || '')}</div>`, body, foot);
  Modal.current = c.id;

  // Interacciones del detalle
  const touch = () => Repo.save('cards', { id: c.id, actualizado: stamp() });
  const refresh = () => { openCard(c.id); render(); };
  $$('[data-state]', el).forEach(b => b.onclick = async () => {
    if (b.dataset.state === c.estado) return;
    await moveCard(c, b.dataset.state, () => { if (Modal.current === c.id && Modal.el.classList.contains('show')) openCard(c.id); });
  });
  $$('[data-chk]', el).forEach(i => i.onchange = async () => { await Repo.save('checklist', { id: Number(i.dataset.chk), hecho: i.checked }); await touch(); refresh(); });
  $$('[data-chk-del]', el).forEach(b => b.onclick = async () => { await Repo.remove('checklist', b.dataset.chkDel); refresh(); });
  $$('[data-com-del]', el).forEach(b => b.onclick = async () => { if (await ask('Eliminar comentario', 'Esta acción no se puede deshacer.')) { await Repo.remove('comentarios', b.dataset.comDel); refresh(); } });
  const cf = $('#chkForm', el); if (cf) cf.onsubmit = async e => { e.preventDefault(); const v = $('#chkNew', el).value.trim(); if (!v) return; await Repo.save('checklist', { id_card: c.id, texto: v, hecho: false, autor: Auth.me(), fecha_alta: stamp() }); await touch(); refresh(); setTimeout(() => $('#chkNew', Modal.el)?.focus(), 50); };
  const mf = $('#comForm', el);
  if (mf) {
    const send = async () => {
      const v = $('#comNew', el).value.trim(); if (!v) return;
      await Repo.save('comentarios', { id_card: c.id, autor: Auth.me(), texto: v, fecha_alta: stamp() });
      await Notif.send(Notif.watchers(c), 'comentario', c, v.slice(0, 120));
      await touch(); refresh();
    };
    mf.onsubmit = e => { e.preventDefault(); send(); };
    $('#comNew', el).onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } };
  }
  const be = $('[data-card-edit]', el); if (be) be.onclick = () => editCard(c);
  const bd = $('[data-card-del]', el); if (bd) bd.onclick = async () => { if (await ask(`Eliminar la card #${c.id}`, 'Se eliminará con su contenido, checklist y comentarios.')) { await deleteCards(c.id); Modal.close(); toast('Card eliminada'); render(); } };
}

/* ------------------------------ Editor de card ------------------------------ */
function editCard(c, defaults = {}) {
  const isNew = !c;
  const st = {
    titulo: c?.titulo || '', estado: c?.estado || defaults.estado || 'seguimiento', prioridad: c?.prioridad || 'Media',
    id_modulo: String(c?.id_modulo || defaults.id_modulo || ''),
    asignados: splitList(c?.asignados), hashtags: splitList(c?.hashtags).map(normTag),
    blocks: c ? Q.bloques(c.id).map(b => ({ ...b })) : [{ tipo: 'texto', contenido: '' }]
  };
  const blockHtml = (b, i) => {
    const head = (ic, label, extra = '') => `<div class="ed-head">${icon(ic)}<span>${label}</span>${extra}<span class="grow"></span>
      <button type="button" class="btn-icon" data-bmove="-1" data-i="${i}" title="Subir" ${i === 0 ? 'disabled' : ''}>${icon('up')}</button>
      <button type="button" class="btn-icon" data-bmove="1" data-i="${i}" title="Bajar" ${i === st.blocks.length - 1 ? 'disabled' : ''}>${icon('down')}</button>
      <button type="button" class="btn-icon danger" data-bdel="${i}" title="Quitar bloque">${icon('trash')}</button></div>`;
    if (b.tipo === 'texto') return `<div class="ed-block">${head('text', 'Texto', '<small class="fw-normal ms-1">usa #hashtag dentro del texto</small>')}<div class="ed-body"><textarea class="form-control" rows="4" data-bval="${i}" placeholder="Describe el requerimiento o el avance">${esc(b.contenido)}</textarea></div></div>`;
    if (b.tipo === 'codigo') return `<div class="ed-block">${head('code', 'Código', `<select class="form-select form-select-sm ms-2" style="width:auto" data-blang="${i}">${CONFIG.LANGS.map(l => `<option ${l === (b.lenguaje || 'plaintext') ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}<div class="ed-body"><textarea class="form-control code" rows="7" spellcheck="false" data-bval="${i}" placeholder="Pega el código aquí">${esc(b.contenido)}</textarea></div></div>`;
    return `<div class="ed-block">${head('clip', 'Archivo')}<div class="ed-body">${b.fileName
      ? `<span class="fchip-file">${icon(/^image\//.test(b.mime) ? 'image' : 'file')}<span>${esc(b.fileName)}</span><span class="sz">${esc(fmtSize(b.size))}</span></span>${!b.url ? ' <small class="text-body-secondary">En el demo solo se guarda el nombre (archivo grande).</small>' : ''}`
      : `<input type="file" class="form-control form-control-sm" data-bfile="${i}" aria-label="Elegir archivo">`}</div></div>`;
  };
  const roles = u => userOf(u).rol;
  const body = () => `
    <div class="mb-3"><label class="form-label small fw-semibold" for="edTitulo">Título</label><input class="form-control" id="edTitulo" maxlength="160" value="${esc(st.titulo)}" placeholder="¿Qué se necesita o qué se avanzó?"></div>
    <div class="mb-3"><label class="form-label small fw-semibold" for="edModulo">Sistema › Módulo</label><select class="form-select" id="edModulo"><option value="">Elige el módulo…</option>${Q.areas().map(a => `<optgroup label="${esc(a.nombre)}">${Q.modulos(a.id).map(m => `<option value="${m.id}" ${String(m.id) === st.id_modulo ? 'selected' : ''}>${esc(a.nombre)} › ${esc(m.nombre)}</option>`).join('')}</optgroup>`).join('')}</select></div>
    <div class="row g-3 mb-3">
      <div class="col-sm-6"><label class="form-label small fw-semibold" for="edEstado">Estado</label><select class="form-select" id="edEstado">${CONFIG.ESTADOS.map(e => `<option value="${e.key}" ${e.key === st.estado ? 'selected' : ''}>${e.label}</option>`).join('')}</select></div>
      <div class="col-sm-6"><label class="form-label small fw-semibold" for="edPrio">Prioridad</label><select class="form-select" id="edPrio">${CONFIG.PRIORIDADES.map(p => `<option ${p === st.prioridad ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
    </div>
    <div class="mb-3"><div class="form-label small fw-semibold">Asignar a</div><div class="pick" id="edPeople">${CONFIG.USERS.map(u => `<button type="button" class="${st.asignados.includes(u.user) ? 'on' : ''}" data-person="${esc(u.user)}">${avatar(u.user)}${esc(u.name)} <small>${esc(roles(u.user))}</small></button>`).join('')}</div></div>
    <div class="mb-3"><label class="form-label small fw-semibold" for="edTagIn">Hashtags</label>
      <div class="tag-input" id="edTags">${st.hashtags.map((t, i) => `<span class="tag">#${esc(t)}<button type="button" class="btn-icon" style="width:18px;height:18px" data-tdel="${i}" aria-label="Quitar">${icon('x')}</button></span>`).join('')}<input id="edTagIn" placeholder="Escribe y presiona Enter" list="edTagList"></div>
      <datalist id="edTagList">${[...new Set(Q.cards().flatMap(Q.tags))].map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
    <div class="form-label small fw-semibold">Contenido</div>
    <div id="edBlocks">${st.blocks.map(blockHtml).join('')}</div>
    <div class="d-flex gap-2 flex-wrap mt-2">
      <button type="button" class="btn btn-sm btn-ghost" data-badd="texto">${icon('text')} Texto</button>
      <button type="button" class="btn btn-sm btn-ghost" data-badd="codigo">${icon('code')} Código</button>
      <button type="button" class="btn btn-sm btn-ghost" data-badd="archivo">${icon('clip')} Archivo</button>
      <span class="small text-body-secondary align-self-center">También puedes pegar una imagen (Ctrl+V).</span>
    </div>`;
  const foot = `<button class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-accent" id="edSave">${isNew ? 'Crear card' : 'Guardar cambios'}</button>`;
  const m = Q.modulo(st.id_modulo);
  const el = Modal.open(isNew ? `Nueva card <div class="small text-body-secondary fw-normal mt-1" style="font-family:var(--font-body)">${esc(m?.nombre || '')}</div>` : `Editar card <span class="idtag">#${esc(c.id)}</span>`, body(), foot);

  const sync = () => {   // copia lo escrito al estado antes de volver a pintar
    st.titulo = $('#edTitulo', el).value; st.id_modulo = $('#edModulo', el).value; st.estado = $('#edEstado', el).value; st.prioridad = $('#edPrio', el).value;
    $$('[data-bval]', el).forEach(t => { st.blocks[t.dataset.bval].contenido = t.value; });
    $$('[data-blang]', el).forEach(s => { st.blocks[s.dataset.blang].lenguaje = s.value; });
  };
  const redraw = () => { $('#mBody').innerHTML = body(); bind(); };   // quien llama ya hizo sync()
  const addFile = (file, i) => new Promise(res => {
    if (Repo === RemoteRepo && file.size > CONFIG.MAX_FILE_MB * 1048576) { toast(`«${file.name}» supera ${CONFIG.MAX_FILE_MB} MB.`, true); return res(); }
    const big = file.size > CONFIG.MAX_FILE_MB_DEMO * 1048576 && Repo === LocalRepo;
    const b = { tipo: 'archivo', fileName: file.name || `imagen-${Date.now()}.png`, mime: file.type || 'application/octet-stream', size: file.size, url: '' };
    if (big) { toast(`«${b.fileName}» pesa más de ${CONFIG.MAX_FILE_MB_DEMO} MB: en el demo solo se guarda el nombre.`); i == null ? st.blocks.push(b) : (st.blocks[i] = b); return res(); }
    const r = new FileReader();
    r.onload = () => { b.url = r.result; i == null ? st.blocks.push(b) : (st.blocks[i] = b); res(); };
    r.onerror = () => { toast('No se pudo leer el archivo', true); res(); };
    r.readAsDataURL(file);
  });
  const addTag = v => { v = normTag(v.replace(/[\s,]+/g, '')); if (v && !st.hashtags.includes(v)) st.hashtags.push(v); };
  const bind = () => {
    $$('[data-person]', el).forEach(b => b.onclick = () => { const u = b.dataset.person; st.asignados = st.asignados.includes(u) ? st.asignados.filter(x => x !== u) : [...st.asignados, u]; b.classList.toggle('on'); });
    $$('[data-badd]', el).forEach(b => b.onclick = () => { sync(); st.blocks.push({ tipo: b.dataset.badd, contenido: '', lenguaje: b.dataset.badd === 'codigo' ? 'sql' : '' }); redraw(); const last = $$('#edBlocks textarea, #edBlocks input[type=file]', el).pop(); last?.focus(); });
    $$('[data-bdel]', el).forEach(b => b.onclick = () => { sync(); st.blocks.splice(+b.dataset.bdel, 1); redraw(); });
    $$('[data-bmove]', el).forEach(b => b.onclick = () => { sync(); const i = +b.dataset.i, j = i + +b.dataset.bmove; [st.blocks[i], st.blocks[j]] = [st.blocks[j], st.blocks[i]]; redraw(); });
    $$('[data-bfile]', el).forEach(inp => inp.onchange = async () => { if (!inp.files[0]) return; sync(); await addFile(inp.files[0], +inp.dataset.bfile); redraw(); });
    $$('[data-tdel]', el).forEach(b => b.onclick = () => { sync(); st.hashtags.splice(+b.dataset.tdel, 1); redraw(); $('#edTagIn', el).focus(); });
    const ti = $('#edTagIn', el);
    ti.onkeydown = e => {
      if ((e.key === 'Enter' || e.key === ',' || e.key === ' ') && ti.value.trim()) { e.preventDefault(); sync(); addTag(ti.value); redraw(); $('#edTagIn', el).focus(); }
      else if (e.key === 'Backspace' && !ti.value && st.hashtags.length) { sync(); st.hashtags.pop(); redraw(); $('#edTagIn', el).focus(); }
    };
    ti.onchange = () => { if (ti.value.trim()) { sync(); addTag(ti.value); redraw(); } };
    $$('textarea.code', el).forEach(t => t.onkeydown = e => { if (e.key === 'Tab') { e.preventDefault(); t.setRangeText('  ', t.selectionStart, t.selectionEnd, 'end'); } });
  };
  bind();
  el.onpaste = async e => {
    const files = [...(e.clipboardData?.files || [])];
    if (!files.length || !Modal.el.contains(e.target)) return;
    e.preventDefault(); sync();
    for (const f of files) await addFile(f);
    redraw(); toast(files.length === 1 ? 'Imagen agregada' : `${files.length} archivos agregados`);
  };
  $('#edSave', el).onclick = async () => {
    sync();
    const pending = $('#edTagIn', el).value.trim(); if (pending) addTag(pending);
    const titulo = st.titulo.trim();
    if (!titulo) { toast('Escribe un título para la card', true); return $('#edTitulo', el).focus(); }
    if (!Q.modulo(st.id_modulo)) { toast('Elige el sistema y módulo de la card', true); return $('#edModulo', el).focus(); }
    const blocks = st.blocks.filter(b => b.tipo === 'archivo' ? b.fileName : String(b.contenido || '').trim());
    if (blocks.some(b => String(b.contenido || '').length > CONFIG.MAX_TEXTO)) { toast(`Un bloque supera ${CONFIG.MAX_TEXTO.toLocaleString('es-MX')} caracteres. Adjúntalo como archivo.`, true); return; }
    const btn = $('#edSave', el); btn.disabled = true;
    try {
      const now = stamp();
      const card = await Repo.save('cards', {
        ...(c ? { id: c.id } : { autor: Auth.me(), fecha_alta: now }),
        id_modulo: Number(st.id_modulo), titulo, estado: st.estado, prioridad: st.prioridad, asignados: st.asignados.join(','), hashtags: st.hashtags.join(','), actualizado: now,
        ...(!c || c.estado !== st.estado ? { fecha_estado: now } : {})
      });
      // Notificar solo a quienes se agregaron ahora
      const before = splitList(c?.asignados);
      await Notif.send(st.asignados.filter(u => !before.includes(u)), 'asignacion', card, '');
      if (c) await Repo.remove('bloques', Q.bloques(c.id).map(b => b.id));
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        await Repo.save('bloques', { id_card: card.id, tipo: b.tipo, contenido: b.contenido || '', lenguaje: b.lenguaje || '', fileName: b.fileName || '', mime: b.mime || '', size: b.size || 0, url: b.url || '', fileId: b.fileId || '', orden: i + 1 });
      }
      toast(isNew ? 'Card creada' : 'Card actualizada');
      render(); openCard(card.id);
    } catch (err) { toast(err.message, true); btn.disabled = false; }
  };
  setTimeout(() => $('#edTitulo', el)?.focus(), 300);
}

/* ------------------------------ Eventos globales ------------------------------ */
document.addEventListener('click', async e => {
  const t = e.target;
  // Copiar código
  const cp = t.closest('[data-copy]');
  if (cp) {
    const code = cp.closest('.code-box').querySelector('code').innerText;
    try { await navigator.clipboard.writeText(code); cp.innerHTML = icon('check') + ' Copiado'; }
    catch { const r = document.createRange(); r.selectNodeContents(cp.closest('.code-box').querySelector('code')); getSelection().removeAllRanges(); getSelection().addRange(r); cp.textContent = 'Selecciona y copia'; }
    setTimeout(() => { cp.innerHTML = icon('copy') + ' Copiar'; }, 1600);
    return;
  }
  // Notificación → ir a la card
  const nt = t.closest('[data-notif]');
  if (nt) {
    const n = (D().notificaciones || []).find(x => String(x.id) === nt.dataset.notif), c = n && Q.card(n.id_card);
    if (!n) return;
    await Notif.read(n.id);
    bootstrap.Dropdown.getInstance(nt.closest('.dropdown').querySelector('[data-bs-toggle]'))?.hide();
    if (c) { go('modulo-' + c.id_modulo); setTimeout(() => openCard(c.id), 60); } else renderBell();
    return;
  }
  // Hashtag en Histórico → buscar en todos los sistemas
  const tgg = t.closest('[data-tag-global]');
  if (tgg) { e.stopPropagation(); State.hq = '#' + tgg.dataset.tagGlobal; render(); return; }
  // Hashtag → filtrar el módulo
  const tg = t.closest('[data-tag]');
  if (tg && !t.closest('.tag-input')) {
    e.preventDefault(); e.stopPropagation();
    State.filters.tag = tg.dataset.tag;
    const inModal = !!tg.closest('.modal');
    if (inModal) { const c = Q.card(Modal.current); Modal.close(); if (c && State.route.view !== 'modulo') { go('modulo-' + c.id_modulo); return; } }
    if (State.route.view === 'tablero') State.tf.q = '#' + tg.dataset.tag;
    if (State.route.view === 'modulo' || State.route.view === 'tablero') render();
    toast('Filtro: #' + tg.dataset.tag);
    return;
  }
  // Archivo → visor
  const fl = t.closest('[data-file]');
  if (fl) { const b = D().bloques.find(x => String(x.id) === fl.dataset.file); if (b) viewFile(b); return; }
  // Acciones
  const a = t.closest('[data-act]');
  if (a) {
    e.preventDefault(); e.stopPropagation();
    const id = a.dataset.id;
    switch (a.dataset.act) {
      case 'login': return bootstrap.Modal.getOrCreateInstance($('#mLogin')).show();
      case 'logout': Auth.logout(); toast('Sesión cerrada: modo lectura'); return render();
      case 'demo-reset':
        if (await ask('Restaurar datos de ejemplo', 'Se borrarán los cambios hechos en este navegador y se cargará el ejemplo inicial.', 'Restaurar')) { LocalRepo.data = seed(); LocalRepo.persist(); toast('Datos de ejemplo restaurados'); go(''); }
        return;
      case 'area-new': return formArea(null);
      case 'cat-import': return importCatalog(window.CATALOGO_SISTEMAS);
      case 'cat-file': return $('#catFile')?.click();
      case 'demo-empty':
        if (await ask('Vaciar datos del demo', 'Se borra todo lo guardado en este navegador para probar la importación del catálogo desde cero.', 'Vaciar')) {
          LocalRepo.data = { sistemas: [], modulos: [], cards: [], bloques: [], checklist: [], comentarios: [], notificaciones: [] }; LocalRepo.persist(); toast('Datos vaciados'); go('');
        }
        return;
      case 'area-edit': return formArea(Q.area(id));
      case 'area-del': return deleteArea(Q.area(id));
      case 'mod-new': return formModulo(null, a.dataset.sistema);
      case 'mod-edit': return formModulo(Q.modulo(id));
      case 'mod-del': return deleteModulo(Q.modulo(id));
      case 'mod-move': return moveModulo(Q.modulo(id), Number(a.dataset.dir));
      case 'area-move': return moveArea(Q.area(id), Number(a.dataset.dir));
      case 'hq-clear': State.hq = ''; render(); $('#hQ')?.focus(); return;
      case 'notif-all': await Notif.read(Notif.unread().map(n => n.id)); renderBell(); toast('Notificaciones marcadas como leídas'); return;
      case 'prefs-reset': Prefs.reset(); applyTheme(); toast('Preferencias restablecidas'); return render();
      case 'card-new': return editCard(null, { estado: a.dataset.estado, id_modulo: State.route.view === 'modulo' ? State.route.id : State.route.view === 'tablero' ? State.tf.modulo : '' });
      case 'card-assign': return assignCard(Q.card(id));
      case 'informe': return formInforme();
      case 'go-mod': Object.keys(State.filters).forEach(k => { State.filters[k] = ''; }); return go('modulo-' + id);
      case 'tf-clear': Object.keys(State.tf).forEach(k => { State.tf[k] = ''; }); return render();
    }
    return;
  }
  // Vista columnas / blog
  const md = t.closest('[data-mode]');
  if (md) { Prefs.set('vista', md.dataset.mode); return render(); }
  // Quitar filtros
  const cl = t.closest('[data-clear]');
  if (cl) { if (cl.dataset.clear === '*') Object.keys(State.filters).forEach(k => { State.filters[k] = ''; }); else State.filters[cl.dataset.clear] = ''; return render(); }
  // Abrir card
  const pc = t.closest('[data-card]');
  if (pc) return openCard(pc.dataset.card);
  // Navegación
  const g = t.closest('[data-go]');
  if (g) {
    e.preventDefault();
    if (g.dataset.go.startsWith('modulo-')) Object.keys(State.filters).forEach(k => { State.filters[k] = ''; }); // cada módulo abre sin filtros
    go(g.dataset.go);
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.matches('input, textarea, select, button')) return;
  const el = e.target.closest('[data-card], [data-go]');
  if (el) { e.preventDefault(); el.click(); }
});
// Métricas y Recientes: recordar si se desplegaron mientras se navega
document.addEventListener('toggle', e => {
  const k = e.target?.dataset?.metrics; if (k && k !== 'inicio') State.mOpen[k] = e.target.open;
}, true);
// Filtros del módulo
let qTimer;
document.addEventListener('input', e => {
  const map = { fTipo: 'tipo', fTag: 'tag', fPersona: 'persona', fRol: 'rol', fPrio: 'prio' };
  if (e.target.id === 'hQ') { clearTimeout(qTimer); qTimer = setTimeout(() => { State.hq = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#hQ'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 250); return; }
  if (e.target.id === 'fQ') { clearTimeout(qTimer); qTimer = setTimeout(() => { State.filters.q = e.target.value.trim(); const pos = e.target.selectionStart; render(); const i = $('#fQ'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 250); return; }
  if (map[e.target.id]) { State.filters[map[e.target.id]] = e.target.value; render(); }
  const tmap = { tSistema: 'sistema', tModulo: 'modulo', tPersona: 'persona', tPrio: 'prio' };
  if (e.target.id === 'tQ') { clearTimeout(qTimer); qTimer = setTimeout(() => { State.tf.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#tQ'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 250); return; }
  if (tmap[e.target.id]) {

function themeNow() {

}
