<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuadernos · Sistema Tickets TFCA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script>
    // Respeta el tema elegido en el sistema (claro/oscuro)
    document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('tfca_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  </script>
  <style>
    body { background: var(--bs-tertiary-bg); min-height: 100vh; }
    .page-head { background: var(--bs-body-bg); border-bottom: 1px solid var(--bs-border-color-translucent); }
    .empty { border: 2px dashed var(--bs-border-color); border-radius: 16px; }
  </style>
</head>
<body>
  <!-- Página independiente: no comparte header ni scripts con el sistema de tickets -->
  <header class="page-head py-2">
    <div class="container d-flex align-items-center gap-3">
      <a href="../index.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Tablero</a>
      <h1 class="h5 mb-0"><i class="bi bi-journal-bookmark text-primary"></i> Cuadernos</h1>
      <span class="ms-auto small text-body-secondary" id="today"></span>
    </div>
  </header>

  <main class="container py-4">
    <!-- ===== Contenido de Cuadernos: reemplaza este bloque ===== -->
    <div class="empty text-center p-5 bg-body">
      <i class="bi bi-journal-plus display-5 text-body-secondary"></i>
      <h2 class="h5 mt-3">Cuadernos</h2>
      <p class="text-body-secondary mb-0">Esta página está lista para recibir su contenido.</p>
    </div>
    <!-- ========================================================= -->
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('today').textContent = new Date()
      .toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })
      .replace(/^./, c => c.toUpperCase());
  </script>
</body>
</html>
